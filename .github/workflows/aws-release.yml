name: AWS release

on:
  pull_request:
    branches: [develop]
    paths:
      - "deploy/**"
      - "docker/postgres/**"
      - ".github/workflows/aws-release.yml"
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: aws-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: bash ./backend/gradlew -p backend test integrationTest

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - name: Validate production Compose
        run: IMAGE_TAG=$GITHUB_SHA POSTGRES_TAG=sample docker compose --env-file deploy/production.env.example -f deploy/compose.yaml config --quiet

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: [backend, ai, web]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DOMAIN: ${{ vars.DOMAIN }}
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment variables
        run: test -n "$ECR_REPOSITORY" && test -n "$EC2_INSTANCE_ID" && test -n "$DOMAIN" && test -n "${{ vars.AWS_ACCOUNT_ID }}"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ap-northeast-2
      - name: Authenticate to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPOSITORY%%/*}"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push application images
        run: |
          repository_name=${ECR_REPOSITORY#*/}
          aws ecr describe-repositories --repository-names "$repository_name" >/dev/null
          if ! aws ecr describe-images --repository-name "$repository_name" --image-ids "imageTag=backend-$GITHUB_SHA" >/dev/null 2>&1; then
            docker buildx build --push -f deploy/backend.Dockerfile -t "$ECR_REPOSITORY:backend-$GITHUB_SHA" .
          fi
          if ! aws ecr describe-images --repository-name "$repository_name" --image-ids "imageTag=ai-$GITHUB_SHA" >/dev/null 2>&1; then
            docker buildx build --push -f ai/Dockerfile -t "$ECR_REPOSITORY:ai-$GITHUB_SHA" ai
          fi
          if ! aws ecr describe-images --repository-name "$repository_name" --image-ids "imageTag=web-$GITHUB_SHA" >/dev/null 2>&1; then
            docker buildx build --push -f deploy/web.Dockerfile -t "$ECR_REPOSITORY:web-$GITHUB_SHA" .
          fi
      - name: Build PostgreSQL image when its source changes
        run: |
          postgres_tag=$(git rev-parse HEAD:docker/postgres | cut -c1-12)
          repository_name=${ECR_REPOSITORY#*/}
          if ! aws ecr describe-images --repository-name "$repository_name" --image-ids "imageTag=postgres-$postgres_tag" >/dev/null 2>&1; then
            docker buildx build --push -f docker/postgres/Dockerfile -t "$ECR_REPOSITORY:postgres-$postgres_tag" docker/postgres
          fi
      - name: Deploy through SSM
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $GITHUB_SHA" \
            --parameters "{\"commands\":[\"bash /opt/ktc4/repo/deploy/deploy.sh $GITHUB_SHA\"],\"executionTimeout\":[\"1200\"]}" \
            --query 'Command.CommandId' --output text)
          for attempt in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query StandardOutputContent --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query '{Status:Status,ResponseCode:ResponseCode,StandardError:StandardErrorContent,StandardOutput:StandardOutputContent}'
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "SSM deployment did not finish within 20 minutes" >&2
          exit 1
      - name: Check public HTTPS
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "https://$DOMAIN/" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1
