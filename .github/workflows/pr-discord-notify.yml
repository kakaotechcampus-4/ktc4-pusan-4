name: PR Discord notify
# 팀 내부 PR(feature/* → develop, 스택 PR 포함)이 리뷰 가능한 상태가 되면 팀 Discord 채널에 알린다.
#   - opened / reopened / ready_for_review : 2분 기다린 뒤 새 PR 알림 + 그때의 리뷰어 멘션
#   - review_requested                      : 그 뒤에 지정된 리뷰어만 따로 멘션
#     (열자마자 리뷰어를 지정하는 경우 메시지가 리뷰어 수만큼 쪼개지지 않게 하려는 것)
# 로직은 tools/pr_discord_bot.py (pr-review-reminder.yml 과 공유).
#
# 설정 (Settings → Secrets and variables → Actions)
#   - secret   TEAM_DISCORD_WEBHOOK : 팀 채널 웹후크 URL
#   - variable DISCORD_USER_IDS     : {"<GitHub login>": "<Discord user ID>", ...}
#                                     없는 login 은 멘션 대신 @login 텍스트로 나간다.
#
# ⚠️ develop → main 은 운영진 notify-discord.yml 이 멘토 채널로 알린다 → branches-ignore: [main]
# ⚠️ secret 이름을 DISCORD_WEBHOOK 으로 바꾸지 말 것. 운영진 워크플로가 쓰는 이름이다.
# ⚠️ concurrency 를 넣지 말 것. 연속으로 열린 PR 알림이 조용히 취소된다.
# ⚠️ pull_request_target 인 이유: fork 에서 온 PR(#52)은 pull_request 이벤트에 secret·variable 이
#   넘어오지 않아 알림이 실패했다. pull_request_target 은 base 브랜치(develop)의 워크플로·코드로
#   돌아서 secret 을 쓸 수 있다. 대신 PR head 코드를 checkout·실행하면 안 된다 — 지금은 develop 의
#   tools/ 만 실행하고 PR 은 API 로 제목·번호만 읽는다. 이 워크플로 수정은 develop 에 머지돼야 반영된다.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, review_requested]
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read  # 리뷰 요청 시각(issue events) 조회

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools

      - name: Send Discord message
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEAM_DISCORD_WEBHOOK: ${{ secrets.TEAM_DISCORD_WEBHOOK }}
          DISCORD_USER_IDS: ${{ vars.DISCORD_USER_IDS }}
        run: python3 tools/pr_discord_bot.py notify
