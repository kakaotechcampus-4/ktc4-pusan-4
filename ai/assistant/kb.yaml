# 비서 get_help 도구의 도움말 문서. 키가 도구의 topic enum 이 된다.
# 화면 문구(frontend/src/pages)와 docs/ 의 현재 규칙에서 옮겼다. 규칙이 바뀌면 여기도 고친다.
승인내역_받는법: >-
  카드사 홈페이지·앱 → 이용(승인)내역 조회 → 엑셀 저장. 지금은 KB국민카드·IBK기업은행 승인내역 .xls 파일만 읽고,
  내려받은 파일은 고치지 말고 그대로 올려야 한다. 청구내역은 할부가 회차별로 쪼개져 있어 350만원 자산 1건이 29만원 12건으로 보이기 때문에
  판정에 쓰지 않고 업로드를 막는다.
화면_흐름: >-
  카드내역 업로드 → 분류 확인(가맹점 카테고리를 모르는 거래) → 사업자 문진 → 판정 전 확인 → 판정 →
  결과와 질문(답하면 묶인 거래를 바로 다시 판정) → 요약 순서로 진행한다.
서비스가_하지_않는_일: >-
  세무 신고·제출·환급 대행, 세액 확정, 절세 컨설팅, 안분 비율 제안을 하지 않는다.
  판단이 필요한 질문은 요약 화면의 '세무대리인에게 넘길 문장'으로 정리한다.
용어_확인필요: >-
  확인 필요는 실패가 아니라 질문에 답하면 판정이 정해지는 상태다.
  룰엔진 판정 범위 밖이라 세무대리인이 봐야 하는 거래도 확인 필요로 남는다.
용어_소명대기: >-
  불가로 추정했지만 사용자가 사정을 밝히면 풀리는 거래다. 주말·공휴일 식대와 여비교통, 생활용품이 해당한다.
  건마다 따로 답해야 하므로 지난번 답이나 일괄 응답으로 채우지 않는다.
지난번_답: >-
  답은 업로드 단위로 저장돼 다른 업로드에 자동으로 적용되지 않는다. 통신·구독처럼 가맹점 단위로 묻는 고정비는
  다른 업로드에서 한 답을 불러와 확인 후 적용할 수 있다. 건마다 사정이 다른 질문은 지난 답의 이력만 보여 준다.
일괄_응답: >-
  남은 질문 그룹이 5개 이하일 때 같은 종류의 질문을 한 번에 답할 수 있다. 소명 대기가 섞인 종류는 한 번에 답하지 않는다.
  일괄로 답한 뒤에도 건별로 다시 바꿀 수 있다.
판정_수정: >-
  질문에 답해서 풀 수 없는 판정은 결과 화면에서 직접 바꿀 수 있다. 바꾼 판정은 해제하기 전까지 다시 판정해도 유지된다.
데이터_경계: >-
  원본 파일, 카드번호, 이용고객명·이용카드명, 승인 시각은 브라우저에만 남는다.
  서버로는 승인일, 가맹점명(의료 업종은 가림), 금액, 할부 개월, 승인번호, 가맹점 사업자번호(IBK기업 파일), 메모(KB국민 파일),
  파일 해시를 보낸다. 파일에서 계산한 카드사, 조회 기간, 처리 상태와 사유, 중복 판별 키도 함께 보낸다.
  소득 금액과 이름은 로그에 남기지 않는다.
  비서에게 물으면 묻는 말과 최근 대화, 지금 화면, 답에 필요한 거래(승인일·가맹점명·카테고리·금액)·판정·질문·근거 조문을
  외부 모델로 보낸다. 소득 금액·이름·이메일은 보내지 않고, 묻지 않으면 보내지 않는다.
