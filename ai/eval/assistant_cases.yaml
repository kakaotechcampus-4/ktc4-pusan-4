- id: S04b
  message: 6,500원 나온 스타벅스는 클라이언트 미팅이었어
  expect: {proposals: [answer q-sb-0919 업무미팅]}
- id: S05
  message: 전포점 스타벅스도 업무미팅으로 해 줘
  expect: {proposals: [answer q-sb-jeonpo 업무미팅]}
- id: S06
  message: 쿠팡 거 지난번처럼 처리해 줘
  expect: {not_proposed: [answer]}
- id: S07
  message: 노트북 사려는데 경비로 넣으면 세금이 얼마나 줄어요?
