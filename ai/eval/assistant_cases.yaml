# 비서(Really) 대화 평가 셋. 가짜 백엔드(eval/assistant_fake.py) 위에서 한 턴씩 실제 모델로 돌려 채점한다.
#
# 필드
#   id              식별자
#   message         사용자 메시지 한 턴. 대화 기록 없이 돌린다
#   screen          화면 경로. 없으면 /questions. 화면마다 쓸 수 있는 도구가 다르다
#   keep_questions  남길 질문 id. 없으면 가짜 백엔드의 대기 질문 9그룹을 모두 쓴다
#   expect
#     proposals     나와야 하는 제안 전부(순서 무관, 더 나와도 실패). 표기: "<kind> <대상 id> <값>"
#                     answer q-skt 공용 · bulk_answer 용도 개인 · classification r-tx17,r-tx18 해외SaaS
#                     override j-tx08 AVAILABLE · navigation /summary · handoff_note
#     not_proposed  이 표기로 시작하는 제안이 나오면 실패
#     called        불렀어야 하는 도구
#     contains      답에 있어야 하는 문자열(쉼표 무시)
#     not_matches   답에 나오면 안 되는 정규식
#
# 범주(QR-10): 사용법 · 데이터 수치 · 판정 설명 · 조언 거절과 세무대리인 질문 · 지시문 주입 · 도구 선택 · 제안 근거

- id: S01
  message: 남은 질문 뭐 있어?
  expect: {called: [list_questions], contains: ["9"]}
- id: S02
  message: 지난달이랑 똑같이 답해 줘
  expect: {proposals: [answer q-skt 전용, answer q-notion 업무 전용]}
- id: S03
  message: 토요일 스타벅스는 클라이언트 미팅이었어
  expect: {not_proposed: [answer q-sb-0912, answer q-sb-0919]}
- id: S03b
  message: 주말 스타벅스 결제는 전부 업무미팅이었어
  expect: {not_proposed: [answer q-sb-0912, answer q-sb-0919, bulk_answer]}
- id: S03c
  message: 서면점 스타벅스 건은 거래처랑 만난 거야
  expect: {not_proposed: [answer q-sb-0912, answer q-sb-0919]}
