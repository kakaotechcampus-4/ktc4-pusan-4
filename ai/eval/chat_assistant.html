<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Really 테스트</title>
<style>
:root { --bg:#f6f7f9; --panel:#fff; --text:#1d2129; --muted:#6b7280; --line:#e3e6ea; --me:#2f6fed; --card:#eef4ff; --code:#f1f3f5; --err:#c2410c; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#14161a; --panel:#1d2026; --text:#e6e8eb; --muted:#9aa1ab; --line:#2c3038; --me:#3b74e8; --card:#1f2a40; --code:#262a31; --err:#fb923c; }
}
* { box-sizing: border-box; }
body { margin:0; font:15px/1.6 system-ui, -apple-system, "Malgun Gothic", sans-serif; background:var(--bg); color:var(--text); }
.wrap { max-width:820px; margin:0 auto; padding:0 16px; display:flex; flex-direction:column; height:100dvh; }
header { padding:14px 0 10px; border-bottom:1px solid var(--line); }
h1 { font-size:18px; margin:0; }
.sub, .meta, summary, .kind { color:var(--muted); }
.sub { font-size:13px; }
.bar { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; align-items:center; font-size:13px; }
select, input, textarea, button { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
button { cursor:pointer; }
button:disabled { opacity:.5; cursor:wait; }
#log { flex:1; overflow-y:auto; padding:16px 0; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:85%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; word-break:break-word; }
.user { align-self:flex-end; background:var(--me); color:#fff; }
.bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
.thinking { font-style:italic; color:var(--muted); }
.card { margin-top:8px; padding:6px 10px; border-radius:8px; background:var(--card); font-size:14px; }
.kind { font-size:12px; margin-right:6px; }
details { margin-top:8px; font-size:13px; white-space:normal; }
summary { cursor:pointer; }
pre { background:var(--code); padding:8px; border-radius:6px; font-size:12px; margin:4px 0 8px; white-space:pre-wrap; word-break:break-all; }
.err { color:var(--err); }
.meta { font-size:12px; margin-top:6px; }
form { display:flex; gap:8px; padding:12px 0 16px; border-top:1px solid var(--line); }
textarea { flex:1; resize:none; height:64px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Really 테스트</h1>
    <div class="sub">모델 {{MODEL}} · 가짜 데이터: 국민카드 2026-09 업로드, 거래 tx01~tx18 (tx16 가맹점 이름에 인젝션 문구가 들어 있음)</div>
    <div class="bar">
      <label>화면 <select id="screen">{{SCREENS}}</select></label>
      <label>보고 있는 거래 <input id="tx" size="8" placeholder="예: tx16"></label>
      <button id="reset" type="button">새 대화</button>
    </div>
  </header>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" maxlength="1000" placeholder="메시지 (Enter 보내기, Shift+Enter 줄바꿈)" autofocus></textarea>
    <button id="send">보내기</button>
  </form>
</div>
<script>
const $ = (id) => document.getElementById(id);
const newSession = () => 'chat-' + crypto.randomUUID();
let history = [];
let sessionId = newSession();

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function add(node) {
  $('log').append(node);
  node.scrollIntoView({ block: 'end' });
  return node;
}

function pretty(v) {
  if (typeof v === 'string') {
    try { v = JSON.parse(v); } catch { return v; }
  }
  return JSON.stringify(v, null, 2);
}

function render(out, secs) {
  const box = el('div', 'msg bot', out.answer);
  for (const p of out.proposals) {
    const card = el('div', 'card');
    card.append(el('span', 'kind', p.kind), p.card);
    box.append(card);
  }
  if (out.calls.length) {
    const rejected = out.calls.filter((c) => c.result?.error).length;
    const d = el('details');
    d.append(el('summary', null, `도구 호출 ${out.calls.length}개` + (rejected ? ` · 거절 ${rejected}개` : '')));
    for (const c of out.calls) {
      d.append(el('div', c.result?.error ? 'err' : null, `${c.name} ${c.arguments ?? ''}`), el('pre', null, pretty(c.result)));
    }
    box.append(d);
  }
  if (out.proposals.length) {
    const d = el('details');
    d.append(el('summary', null, '제안 카드 원본'), el('pre', null, pretty(out.proposals)));
    box.append(d);
  }
  box.append(el('div', 'meta', `${secs.toFixed(1)}초` + (out.traceId ? ` · trace ${out.traceId}` : '')));
  add(box);
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = $('input').value.trim();
  if (!message || $('send').disabled) return;
  $('input').value = '';
  add(el('div', 'msg user', message));
  const wait = add(el('div', 'msg bot thinking', '답을 만드는 중…'));
  $('send').disabled = true;
  const t0 = performance.now();
  try {
    // 프론트(logic.ts trimHistory)와 같이 최근 20개, 한 개 2000자까지 보낸다.
    const body = {
      message,
      history: history.slice(-20).map((m) => ({ role: m.role, content: m.content.slice(0, 2000) })),
      context: { screen: $('screen').value, transactionId: $('tx').value.trim() || null },
      sessionId,
    };
    const res = await fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const out = await res.json();
    if (!res.ok) throw new Error(`${res.status} ${JSON.stringify(out.detail ?? out)}`);
    wait.remove();
    render(out, (performance.now() - t0) / 1000);
    history.push({ role: 'user', content: message }, { role: 'assistant', content: out.answer });
  } catch (err) {
    wait.className = 'msg bot err';
    wait.textContent = '오류: ' + err.message;
  } finally {
    $('send').disabled = false;
    $('input').focus();
  }
});

$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $('form').requestSubmit();
  }
});

$('reset').addEventListener('click', () => {
  history = [];
  sessionId = newSession();
  $('log').replaceChildren();
  $('input').focus();
});
</script>
</body>
</html>
