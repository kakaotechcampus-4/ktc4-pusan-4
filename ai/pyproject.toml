[project]
name = "ktc4-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "openai>=3.16",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2>=2.12", "ruff>=0.8", "pyyaml>=6"]

[tool.uv]
package = false