spring:
  application:
    name: backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  # 공휴일 동기화 (공공데이터포털 「한국천문연구원_특일 정보」). 키가 비면 동기화를 건너뛰고 표에 있는 값만 쓴다.
  # 키는 포털의 Decoding 키다. 요청할 때 코드가 URL 인코딩한다.
  holiday:
    base-url: https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService
    api-key: ${HOLIDAY_API_KEY:}
  # 판정 규칙. 기본값은 backend/ 에서 bootRun·테스트를 돌릴 때 기준이다.
  # 이미지는 APP_RULES_DIR(/app/rules)·APP_RULES_COMMIT_SHA(빌드 커밋)로 덮는다(deploy/backend.Dockerfile).
  # commit-sha 는 judgment.rules_commit_sha 에 남아, 그 커밋을 checkout 해 판정 당시 rules/ 를 되찾는 데 쓴다.
  rules:
    dir: ../rules
    commit-sha: local
  # 판정 run 실행 풀 (JudgmentRunExecutorConfiguration). 운영(EC2 t3.medium, 2 vCPU 를 DB·AI 와 함께 씀) 값이다.
  # 로컬 개발 값은 application-local.yml 에 따로 둔다.
  # - workers: 동시에 도는 run 수. 하나가 DB 커넥션(Hikari 기본 10개)을 하나 쓴다.
  #   백엔드·DB 에 CPU 를 1개씩만 준 측정에서 처리량이 1개 157, 2개 254(1.6배), 4개 265건/초(1.7배)였다.
  #   4개는 처리량이 늘지 않고 진행률 GET 이 최대 175ms 로 느려져 2개로 둔다.
  # - queue-capacity: 기다릴 수 있는 run 수. 멈춘 run 정리(진행 없음 5분)는 QUEUED 도 끝내므로,
  #   queue-capacity × run 하나 시간 / workers 가 5분보다 짧아야 한다. 워커 하나가 초당 약 127건이라 1,200건 run 이
  #   약 9.4초이고 상한은 약 64다. EBS·CPU 크레딧은 측정에 없어 50 으로 둔다.
  judgment-run:
    workers: 2
    queue-capacity: 50
  # 인증 (api.md 1.1). 고정 사용자 하나만 로그인한다 — 실제 계정은 B9b, 리프레시 토큰 저장소(Redis)는 B9c.
  # jwt-secret 이 비면 기동할 때마다 임시 키를 만든다(재기동하면 로그인이 풀린다). 넣는다면 32바이트 이상.
  # demo-password 가 비면 아무도 로그인할 수 없다.
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET:}
    demo-password: ${APP_AUTH_DEMO_PASSWORD:}
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  # Redis 는 리프레시 토큰만 맡는다. Redis 가 내려가도 백엔드 전체를 unhealthy 로 만들어 배포를 멈추지 않게 health 에서 뺀다.
  health:
    redis:
      enabled: false

# 스웨거는 기본으로 닫는다. 로컬(application-local.yml)에서만 연다.
# 프로필을 빠뜨려도 운영에 노출되지 않는 쪽으로 떨어지게 하기 위해서다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  # @RestControllerAdvice 응답을 모든 API 에 자동으로 붙이지 않는다.
  override-with-generic-response: false
