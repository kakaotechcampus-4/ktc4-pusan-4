spring:
  application:
    name: backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    # 한 트랜잭션에서 같은 insert·update 가 이어지면 모아서 보낸다. run 생성의 item 3,000개 insert 가 한 번씩 왕복하지 않게 하려고 켰다.
    # order_inserts 는 켜지 않는다. 엔티티에 연관관계 매핑이 없어 Hibernate 가 FK 순서를 모르고, 테이블별로 묶다가
    # 자식 insert 를 새 부모보다 먼저 보낼 수 있다(InsertOrderIntegrationTest).
    properties:
      hibernate:
        jdbc.batch_size: 100
  datasource:
    hikari:
      # PG 드라이버가 모인 insert 를 여러 행 insert 한 문장으로 바꿔 보낸다. DB 가 처리하는 문장 수도 준다.
      data-source-properties:
        reWriteBatchedInserts: true

app:
  # 공휴일 동기화 (공공데이터포털 「한국천문연구원_특일 정보」). 키가 비면 동기화를 건너뛰고 표에 있는 값만 쓴다.
  # 키는 포털의 Decoding 키다. 요청할 때 코드가 URL 인코딩한다.
  holiday:
    base-url: https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService
    api-key: ${HOLIDAY_API_KEY:}
  # 판정 규칙. 기본값은 backend/ 에서 bootRun·테스트를 돌릴 때 기준이다.
  # 이미지는 APP_RULES_DIR(/app/rules)·APP_RULES_COMMIT_SHA(빌드 커밋)로 덮는다(deploy/backend.Dockerfile).
  # commit-sha 는 judgment.rules_commit_sha 에 남아, 그 커밋을 checkout 해 판정 당시 rules/ 를 되찾는 데 쓴다.
  rules:
    dir: ../rules
    commit-sha: local

management:
  endpoints:
    web:
      exposure:
        include: health

# 스웨거는 기본으로 닫는다. 로컬(application-local.yml)에서만 연다.
# 프로필을 빠뜨려도 운영에 노출되지 않는 쪽으로 떨어지게 하기 위해서다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  # @RestControllerAdvice 응답을 모든 API 에 자동으로 붙이지 않는다.
  override-with-generic-response: false
