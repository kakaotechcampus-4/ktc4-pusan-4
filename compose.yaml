services:
  postgres:
    build: ./docker/postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ktc4}
      POSTGRES_USER: ${DB_USERNAME:-ktc4}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ktc4-local}
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  ai:
    build: ./ai
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME:-ktc4}:${DB_PASSWORD:-ktc4-local}@postgres:5432/${DB_NAME:-ktc4}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${AI_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
