services:
  postgres:
    build: ./docker/postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ktc4}
      POSTGRES_USER: ${DB_USERNAME:-ktc4}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ktc4-local}
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/20-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  # 리프레시 토큰 저장소(B9c). 로컬은 운영과 같은 설정으로 띄운다(deploy/compose.yaml)
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  ai:
    build: ./ai
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME:-ktc4}:${DB_PASSWORD:-ktc4-local}@postgres:5432/${DB_NAME:-ktc4}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      AGENT_REASONING_EFFORT: ${AGENT_REASONING_EFFORT:-}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      ASSISTANT_REASONING_EFFORT: ${ASSISTANT_REASONING_EFFORT:-}
      # 비서 도구가 부르는 백엔드. 로컬 compose 에는 백엔드가 없어 비우면 localhost:8080 이다
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    ports:
      - "${AI_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
