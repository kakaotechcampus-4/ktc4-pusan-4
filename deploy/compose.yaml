name: ktc4

# 백엔드 말고는 서버 디스크에 남기되 크기를 묶는다. Docker 기본 json-file 은 상한이 없어 디스크가 찬다.
x-logging: &rotated-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: ${ECR_REPOSITORY}:postgres-${POSTGRES_TAG}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    logging: *rotated-logging

  # 리프레시 토큰 저장소(B9c). 포트는 열지 않고 compose 내부망으로만 쓴다.
  # 토큰은 모두 TTL 이 있어 메모리가 차면 오래 안 쓴 토큰부터 지운다(volatile-lru). 지워진 사용자는 다시 로그인한다.
  # AOF 로 재시작해도 로그인이 유지된다.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    mem_limit: 192m
    logging: *rotated-logging

  backend:
    image: ${ECR_REPOSITORY}:backend-${IMAGE_TAG}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      ASSISTANT_SERVER_URL: http://ai:8000
      CLASSIFY_ENABLED: ${CLASSIFY_ENABLED:-false}
      CLASSIFY_SERVER_URL: http://ai:8000
      HOLIDAY_API_KEY: ${HOLIDAY_API_KEY:-}
      APP_AUTH_JWT_SECRET: ${APP_AUTH_JWT_SECRET:-}
      APP_AUTH_KAKAO_REST_API_KEY: ${APP_AUTH_KAKAO_REST_API_KEY:-}
      APP_AUTH_KAKAO_CLIENT_SECRET: ${APP_AUTH_KAKAO_CLIENT_SECRET:-}
      APP_AUTH_KAKAO_REDIRECT_URI: ${APP_AUTH_KAKAO_REDIRECT_URI:-}
      APP_MAIL_USERNAME: ${APP_MAIL_USERNAME:-}
      APP_MAIL_PASSWORD: ${APP_MAIL_PASSWORD:-}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1200m
    # 호스트의 CloudWatch Agent 가 /actuator/prometheus 를 긁는다. 127.0.0.1 에만 열어 밖에서는 닿지 않는다.
    ports:
      - "127.0.0.1:8080:8080"
    # 로그는 CloudWatch Logs /ktc4/backend 로 간다(docs/deployment.md 13절). Docker 데몬이 호스트에서 인스턴스 역할로 보내므로
    # 컨테이너에 자격 증명이 없어도 된다. 그룹은 모니터링 스택이 보존 기간과 함께 만든다. 자동으로 만들면 보존이 무기한이라 끈다.
    # 그래서 그룹이 없으면 컨테이너가 뜨지 않는다. non-blocking 은 CloudWatch 가 느려도 앱 로그 쓰기가 멈추지 않게 한다.
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-northeast-2
        awslogs-group: /ktc4/backend
        awslogs-create-group: "false"
        mode: non-blocking
    # 종료할 때 판정 run 을 app.judgment-run.await-termination(60s)까지 기다린다(application.yml).
    # Docker 기본값(10s)이면 그 전에 SIGKILL 로 꺼진다. 웹 요청 종료 대기(최대 30s) 뒤에 이어지므로 합 90s 에 10s 를 더 둔다.
    stop_grace_period: 100s

  ai:
    image: ${ECR_REPOSITORY}:ai-${IMAGE_TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      AGENT_REASONING_EFFORT: ${AGENT_REASONING_EFFORT:-}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      ASSISTANT_REASONING_EFFORT: ${ASSISTANT_REASONING_EFFORT:-}
      CLASSIFY_API_KEY: ${CLASSIFY_API_KEY:-}
      CLASSIFY_BASE_URL: ${CLASSIFY_BASE_URL:-}
      CLASSIFY_MODEL: ${CLASSIFY_MODEL:-}
      BACKEND_BASE_URL: http://backend:8080/api/v1
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LAW_API_OC: ${LAW_API_OC:-test}
      TEAM_DISCORD_WEBHOOK: ${TEAM_DISCORD_WEBHOOK:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/db', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    mem_limit: 512m
    logging: *rotated-logging

  # 이미지가 커밋과 무관해 배포해도 다시 뜨지 않는다. 화면 파일은 web-dist 볼륨에서, 설정은 서버 repo 의 deploy/caddy/ 에서 읽는다.
  # Caddyfile 변경은 deploy.sh 가 caddy reload 로 반영한다. 디렉터리째 붙이는 이유: 파일 하나만 붙이면 git checkout 이 새로 쓴 파일이 컨테이너에 보이지 않는다.
  # 버전을 올리면 그 배포에서만 컨테이너가 다시 떠 몇 초 끊긴다.
  web:
    image: caddy:2.11.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy:/etc/caddy:ro
      - web-dist:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 256m
    logging: *rotated-logging

  # 커밋의 화면 파일을 web-dist 볼륨에 옮기고 끝난다(deploy/web-publish.sh). up 으로는 뜨지 않고 deploy.sh 가 run 으로 부른다.
  web-files:
    image: ${ECR_REPOSITORY}:web-${IMAGE_TAG}
    profiles: [publish]
    volumes:
      - web-dist:/srv

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  web-dist:
