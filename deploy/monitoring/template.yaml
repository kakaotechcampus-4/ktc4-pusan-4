AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ktc4 모니터링 스택. 백엔드 로그 그룹, 알람을 Discord 로 보내는 Lambda, EC2 알람.
  배포는 deploy/monitoring/deploy.sh (서울 리전 전용).

Parameters:
  InstanceId:
    Type: AWS::EC2::Instance::Id
    Description: 운영 EC2 인스턴스 ID (GitHub 변수 EC2_INSTANCE_ID 와 같은 값)
  DiscordWebhookUrl:
    Type: String
    NoEcho: true
    AllowedPattern: "^https://(discord|discordapp)\\.com/api/webhooks/.+"
    Description: 장애 알림 스레드로 가는 웹훅 URL (?thread_id=<스레드 ID> 포함)
  BackendLogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [7, 14, 30]
  RootFsType:
    Type: String
    Default: ext4
    Description: >-
      루트 디스크 지표의 fstype 차원 값. Agent 설치 뒤
      aws cloudwatch list-metrics --namespace CWAgent --metric-name disk_used_percent 로 확인한다.

Resources:
  # A3 의 compose awslogs 드라이버가 이 그룹에 쓴다. awslogs-create-group 은 false 다.
  # 스택을 지워도 로그는 남긴다. 같은 이름으로 다시 만들려면 그룹을 먼저 지워야 한다.
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /ktc4/backend
      RetentionInDays: !Ref BackendLogRetentionDays

  # CloudWatch Agent(B2)가 긁은 Prometheus 값을 EMF 로그로 여기에 쓰고, CloudWatch 가 지표로 뽑는다.
  # 지표로 뽑은 뒤에는 쓸 일이 없어 짧게 둔다.
  PrometheusLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ktc4/prometheus
      RetentionInDays: 3

  # Lambda 가 처음 실행될 때 자동으로 만드는 그룹은 보존 기간이 무기한이라 미리 만든다.
  AlarmToDiscordLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/ktc4-alarm-to-discord
      RetentionInDays: 14

  AlarmToDiscordRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        # 로그 그룹은 위에서 만들었으므로 CreateLogGroup 은 주지 않는다.
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${AlarmToDiscordLogGroup.Arn}"

  AlarmToDiscordFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: ktc4-alarm-to-discord
      Runtime: python3.12
      Handler: alarm_to_discord.handler
      # deploy.sh 가 alarm_to_discord.py 를 zip 으로 묶어 템플릿 옆에 두고, cloudformation package 가 S3 에 올린다.
      # .py 를 그대로 두면 CLI v2 가 zip 으로 묶지 않고 올려 Lambda 가 "Could not unzip" 으로 실패한다.
      Code: alarm_to_discord.zip
      Role: !GetAtt AlarmToDiscordRole.Arn
      Timeout: 10
      MemorySize: 128
      LoggingConfig:
        LogGroup: !Ref AlarmToDiscordLogGroup
      Environment:
        Variables:
          DISCORD_WEBHOOK_URL: !Ref DiscordWebhookUrl

  # 알람이 Lambda 를 직접 부를 수 있게 한다. 이 스택의 알람은 모두 ktc4- 로 시작한다.
  AlarmInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AlarmToDiscordFunction.Arn
      Action: lambda:InvokeFunction
      Principal: lambda.alarms.cloudwatch.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ktc4-*"

  # 기본 모니터링이라 EC2 지표는 5분 간격이다.
  CpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmInvokePermission
    Properties:
      AlarmName: ktc4-ec2-cpu-high
      AlarmDescription: EC2 CPU 80% 이상이 5분 단위 2번 연속
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceId
          Value: !Ref InstanceId
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions: [!GetAtt AlarmToDiscordFunction.Arn]
      OKActions: [!GetAtt AlarmToDiscordFunction.Arn]

  # 인스턴스·시스템 상태 검사 중 하나라도 실패. 상태 검사 지표는 기본 모니터링에서도 1분 간격이다.
  StatusCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmInvokePermission
    Properties:
      AlarmName: ktc4-ec2-status-check-failed
      AlarmDescription: EC2 상태 검사 실패
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref InstanceId
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions: [!GetAtt AlarmToDiscordFunction.Arn]
      OKActions: [!GetAtt AlarmToDiscordFunction.Arn]

  # ---- B3: 로그 메트릭 필터 ----
  # 필드 이름은 docs/monitoring_plan.md 의 계약(요청 로그 status, 기동 문구)을 따른다.
  # A1 의 실제 JSON 로그 한 줄로 aws logs test-metric-filter 를 돌려 확인한다.
  Http5xxMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BackendLogGroup
      FilterName: http-5xx
      FilterPattern: "{ $.status >= 500 }"
      MetricTransformations:
        - MetricNamespace: ktc4/backend
          MetricName: http_5xx_count
          MetricValue: "1"
          Unit: Count

  RestartMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BackendLogGroup
      FilterName: backend-started
      FilterPattern: '"Started BackendApplication"'
      MetricTransformations:
        - MetricNamespace: ktc4/backend
          MetricName: backend_start_count
          MetricValue: "1"
          Unit: Count

  # ---- B3: 알람 ----
  # 건수 알람 두 개는 일이 생긴 순간만 알린다. 복구(OK) 알림은 보내지 않는다.
  # 건이 없으면 지표가 비므로 TreatMissingData 를 notBreaching 으로 둔다.
  Http5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmInvokePermission
    Properties:
      AlarmName: ktc4-backend-http-5xx
      AlarmDescription: 백엔드 5xx 응답 발생 (5분에 1건 이상). Logs Insights 에서 status >= 500 으로 찾는다.
      Namespace: ktc4/backend
      MetricName: http_5xx_count
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!GetAtt AlarmToDiscordFunction.Arn]

  RestartAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmInvokePermission
    Properties:
      AlarmName: ktc4-backend-restarted
      AlarmDescription: 백엔드가 (다시) 기동했다. 배포 때도 울린다. 배포가 아니면 재시작 원인을 본다.
      Namespace: ktc4/backend
      MetricName: backend_start_count
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!GetAtt AlarmToDiscordFunction.Arn]

  MemoryHighAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmInvokePermission
    Properties:
      AlarmName: ktc4-ec2-memory-high
      AlarmDescription: EC2 메모리 사용률 90% 이상 5분
      Namespace: CWAgent
      MetricName: mem_used_percent
      Dimensions:
        - Name: InstanceId
          Value: !Ref InstanceId
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 90
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions: [!GetAtt AlarmToDiscordFunction.Arn]
      OKActions: [!GetAtt AlarmToDiscordFunction.Arn]

  DiskHighAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: AlarmInvokePermission
    Properties:
      AlarmName: ktc4-ec2-disk-high
      AlarmDescription: EC2 루트 디스크 사용률 80% 이상
      Namespace: CWAgent
      MetricName: disk_used_percent
      Dimensions:
        - Name: InstanceId
          Value: !Ref InstanceId
        - Name: path
          Value: /
        - Name: fstype
          Value: !Ref RootFsType
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions: [!GetAtt AlarmToDiscordFunction.Arn]
      OKActions: [!GetAtt AlarmToDiscordFunction.Arn]

  # ---- B3: 대시보드 ----
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: ktc4-backend
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type": "metric", "x": 0, "y": 0, "width": 8, "height": 6, "properties": {
              "title": "CPU (%)", "region": "${AWS::Region}", "stat": "Average", "period": 300,
              "metrics": [["AWS/EC2", "CPUUtilization", "InstanceId", "${InstanceId}"]],
              "yAxis": {"left": {"min": 0, "max": 100}}}},
            {"type": "metric", "x": 8, "y": 0, "width": 8, "height": 6, "properties": {
              "title": "메모리 (%)", "region": "${AWS::Region}", "stat": "Average", "period": 300,
              "metrics": [["CWAgent", "mem_used_percent", "InstanceId", "${InstanceId}"]],
              "yAxis": {"left": {"min": 0, "max": 100}}}},
            {"type": "metric", "x": 16, "y": 0, "width": 8, "height": 6, "properties": {
              "title": "루트 디스크 (%)", "region": "${AWS::Region}", "stat": "Maximum", "period": 300,
              "metrics": [["CWAgent", "disk_used_percent", "InstanceId", "${InstanceId}", "path", "/", "fstype", "${RootFsType}"]],
              "yAxis": {"left": {"min": 0, "max": 100}}}},
            {"type": "metric", "x": 0, "y": 6, "width": 8, "height": 6, "properties": {
              "title": "5xx · 기동 (건)", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
              "metrics": [
                ["ktc4/backend", "http_5xx_count", {"label": "5xx"}],
                ["ktc4/backend", "backend_start_count", {"label": "기동"}]]}},
            {"type": "metric", "x": 8, "y": 6, "width": 8, "height": 6, "properties": {
              "title": "JVM 힙 사용량 (bytes)", "region": "${AWS::Region}", "stat": "Sum", "period": 60,
              "metrics": [["ktc4/backend", "jvm_memory_used_bytes", "job", "ktc4-backend"]]}},
            {"type": "metric", "x": 16, "y": 6, "width": 8, "height": 6, "properties": {
              "title": "대기 (Hikari 커넥션 · 판정 실행 풀)", "region": "${AWS::Region}", "stat": "Maximum", "period": 60,
              "metrics": [
                ["ktc4/backend", "hikaricp_connections_pending", "job", "ktc4-backend", {"label": "Hikari 대기"}],
                ["ktc4/backend", "executor_queued_tasks", "job", "ktc4-backend", {"label": "판정 풀 대기열"}]]}}
          ]
        }

Outputs:
  BackendLogGroupName:
    Value: !Ref BackendLogGroup
  AlarmToDiscordFunctionArn:
    Description: 알람의 AlarmActions 에 쓴다
    Value: !GetAtt AlarmToDiscordFunction.Arn
