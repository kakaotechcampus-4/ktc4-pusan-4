<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PreeT 팀 문서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 색은 앱 frontend/tailwind.config.js 와 같다: accent·accent-hover·highlight·blush·accent-soft·line·ink·muted·ink2·surface */
  :root { --blue:#2C6AE8; --blue-d:#1C5FD4; --pink:#FF5C9A; --pink-l:#FFE3EE; --blue-l:#E4EDFB; --line:#E5E8EB; --text:#191F28; --muted:#6B7684; --ink2:#4E5968; --surface:#F2F4F6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--text); background:#fff; }
  a { color:var(--blue); }
  /* 상단 바 */
  .top { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:28px; height:64px; padding:0 32px; background:#fff; border-bottom:1px solid var(--line); box-shadow:0 1px 0 0 rgba(22,24,29,.06), 0 6px 16px -10px rgba(22,24,29,.22); }
  .mark { display:block; line-height:0; }
  .mark svg { height:28px; width:auto; display:block; }
  .tabs { display:flex; gap:4px; height:100%; }
  .tabs a { display:flex; align-items:center; padding:0 14px; color:var(--muted); text-decoration:none; font-size:15px; font-weight:600; border-bottom:2px solid transparent; }
  .tabs a:hover { color:var(--text); }
  .tabs a.on { color:var(--blue); border-color:var(--blue); }
  .gh { margin-left:auto; font-size:14px; font-weight:600; text-decoration:none; padding:8px 16px; border:1px solid var(--line); border-radius:999px; color:var(--text); }
  .gh:hover { border-color:var(--blue); color:var(--blue); }
  /* 홈 */
  .hero { max-width:1080px; margin:24px auto 0; border-radius:20px; background:var(--blue); color:#fff; padding:64px 56px; }
  .home { max-width:1080px; margin:0 auto; }
  .hero .k { margin:0; opacity:.75; font-weight:600; font-size:14px; }
  .hero h1 { font-size:44px; line-height:1.3; margin:12px 0 16px; letter-spacing:-1px; }
  .hero h1 em { font-style:normal; color:var(--pink); background:#fff; padding:0 10px; border-radius:10px; }
  .hero p { font-size:17px; opacity:.92; margin:0 0 28px; line-height:1.7; color:#fff; }
  .btn { display:inline-block; background:#fff; color:var(--blue); font-weight:700; padding:13px 24px; border-radius:999px; text-decoration:none; }
  .btn:hover { background:var(--blue-l); color:var(--blue-d); }
  .home { padding:8px 32px 64px; }
  .home h2 { font-size:18px; margin:40px 0 14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .card { display:block; background:var(--surface); border-radius:24px; padding:24px; text-decoration:none; color:var(--text); transition:background-color .15s cubic-bezier(.23,1,.32,1); }
  .card:hover { background:var(--blue-l); }
  .card b { display:block; font-size:16px; margin-bottom:6px; }
  .card small { color:var(--muted); font-size:13px; line-height:1.6; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  /* 문서 */
  .page { max-width:1080px; margin:0 auto; padding:40px 32px 72px; display:grid; grid-template-columns:minmax(0,1fr) 220px; gap:56px; }
  .crumb { font-size:13px; color:var(--muted); }
  .crumb a { color:var(--muted); text-decoration:none; }
  .crumb a:hover { color:var(--blue); }
  .sib { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 8px; }
  .sib a { font-size:13px; font-weight:600; padding:6px 12px; border-radius:999px; background:var(--blue-l); color:var(--blue-d); text-decoration:none; }
  .sib a.on { background:var(--blue); color:#fff; }
  article h1 { font-size:34px; letter-spacing:-.8px; margin:10px 0 8px; }
  article h2 { font-size:21px; margin:44px 0 12px; scroll-margin-top:84px; }
  article h3 { font-size:16px; margin-top:28px; color:var(--blue-d); }
  p, li { line-height:1.8; color:var(--ink2); }
  blockquote { margin:14px 0; padding:14px 18px; border-left:3px solid var(--blue); background:var(--surface); border-radius:0 12px 12px 0; }
  code { background:var(--blue-l); color:var(--blue-d); padding:2px 6px; border-radius:6px; font-size:.88em; }
  pre { background:#191F28; color:#E5E8EB; padding:18px 20px; border-radius:14px; overflow-x:auto; font-size:13px; line-height:1.65; }
  pre code { background:none; color:inherit; padding:0; }
  table { border-collapse:collapse; width:100%; margin:14px 0; font-size:14px; border-top:2px solid var(--text); }
  th, td { padding:10px 12px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line); }
  th { font-size:13px; color:var(--muted); font-weight:700; }
  .todo { display:inline-block; background:#FDF3E3; color:#8A5A10; font-size:12px; font-weight:600; padding:2px 10px; border-radius:999px; }
  .toc { position:sticky; top:96px; align-self:start; font-size:13px; }
  .toc p { margin:0 0 10px; font-weight:700; color:var(--muted); font-size:12px; }
  .toc a { display:block; padding:5px 0 5px 12px; border-left:2px solid var(--line); color:var(--muted); text-decoration:none; cursor:pointer; }
  .toc a:hover { color:var(--blue); border-color:var(--blue); }
  .toc a { transition:color .25s, background-color .25s; }
  .toc a.on { color:var(--text); font-weight:700; background:linear-gradient(90deg,var(--blue-l),transparent); }
  .toc-ind { position:absolute; left:0; top:0; width:2px; height:0; background:var(--blue); border-radius:2px; transition:transform .35s cubic-bezier(.3,.7,.2,1), height .35s; pointer-events:none; }
  @media (prefers-reduced-motion:reduce) { .toc-ind, .toc a { transition:none; } }
  a.repo { text-decoration:none; white-space:nowrap; }
  a.repo:hover code { background:var(--blue); color:#fff; }
  .rel { margin-top:56px; padding:24px; background:var(--surface); border-radius:24px; display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
  .rel p { grid-column:1/-1; margin:0 0 4px; font-size:13px; font-weight:700; color:var(--blue-d); }
  .rel a { background:#fff; border-radius:16px; padding:12px 14px; text-decoration:none; color:var(--text); transition:background-color .15s; }
  .rel a:hover { background:var(--blue-l); }
  .rel b { display:block; font-size:14px; }
  .rel small { color:var(--muted); font-size:12px; }
  .pager { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:56px; }
  .pager a { padding:16px 18px; background:var(--surface); border-radius:16px; text-decoration:none; color:var(--text); font-weight:700; font-size:15px; }
  .pager a small { display:block; color:var(--muted); font-weight:500; font-size:12px; margin-bottom:4px; }
  .pager a:hover { background:var(--blue-l); color:var(--blue-d); }
  .pager .n { text-align:right; grid-column:2; }
  @media (max-width:860px) { .page { grid-template-columns:1fr; } .toc { display:none; } .top { gap:12px; padding:0 16px; } .tabs a { padding:0 8px; font-size:14px; white-space:nowrap; } .gh { display:none; } .hero h1 { font-size:32px; } }
  /* 오른쪽 아래 홈 버튼 (Really 코 클로즈업, 색은 frontend/src/assets/brand/really-fab 기준) */
  .fab { position:fixed; right:28px; bottom:28px; z-index:20; width:64px; height:64px; border-radius:50%; border:3px solid #fff; box-shadow:0 4px 0 rgba(217,81,140,.25); transition:transform .15s; }
  .fab:hover { transform:translateY(-3px) scale(1.05); }
  .fab svg { width:100%; height:100%; display:block; }
  @media (max-width:860px) { .fab { width:56px; height:56px; right:16px; bottom:16px; } }
  .why { margin:6px 0 0; font-size:13px; color:var(--muted); line-height:1.7; }
  .why-label { display:inline-block; font-size:11px; font-weight:700; color:var(--blue-d); background:var(--blue-l); padding:1px 8px; border-radius:999px; margin-right:6px; }
  .shot { margin:12px 0; padding:28px; border:2px dashed var(--line); border-radius:14px; text-align:center; color:var(--muted); font-size:13px; }
  .team { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin:16px 0; }
  .role { background:var(--surface); border-radius:24px; padding:20px; }
  .role b { font-size:16px; } .role small { display:block; color:var(--muted); font-size:13px; margin:4px 0 12px; }
  .ppl { display:flex; flex-wrap:wrap; gap:8px; }
  .person { display:flex; align-items:center; gap:8px; padding:5px 12px 5px 5px; border-radius:999px; background:var(--blue-l); color:var(--blue-d); font-size:13px; font-weight:600; text-decoration:none; }
  .person:hover { background:var(--blue); color:#fff; }
  .person { background:#fff; }
  .person img { width:26px; height:26px; border-radius:50%; background:#fff; }
  .btn.ghost { background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.6); margin-left:8px; }
  .btn.ghost:hover { background:#fff; color:var(--blue); }
  /* 노션 작업 보드 요약 */
  .board { margin:16px 0 8px; padding:24px; border-radius:24px; background:var(--surface); }
  .board-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px; }
  .board-head b { font-size:16px; } .board-head small { color:var(--muted); font-size:12px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .stats > div { background:#fff; border-radius:16px; padding:14px 16px; }
  .stats small { display:block; color:var(--muted); font-size:12px; }
  .stats b { display:block; font-size:30px; font-weight:800; color:var(--blue); letter-spacing:-1px; line-height:1.3; }
  .stats > div:nth-child(2) b { color:var(--pink); }
  .stats em { font-style:normal; font-size:14px; margin-left:2px; color:var(--muted); font-weight:600; }
  .board-sub { margin:22px 0 10px; font-size:13px; font-weight:700; color:var(--blue-d); }
  .bars { display:grid; gap:8px; }
  .bar { display:grid; grid-template-columns:72px 1fr 32px; align-items:center; gap:10px; font-size:13px; }
  .bar span { color:var(--muted); font-weight:600; }
  .bar i { display:block; height:14px; width:var(--w); border-radius:999px; background:var(--blue); }
  .bar b { text-align:right; }
  .steps { list-style:none; padding:0; margin:0; display:grid; grid-template-columns:repeat(3,1fr); gap:12px; counter-reset:st; }
  .steps li { position:relative; background:#fff; border-radius:16px; padding:14px 16px 14px 50px; line-height:1.5; counter-increment:st; }
  .steps li::before { content:counter(st); position:absolute; left:14px; top:14px; width:24px; height:24px; border-radius:50%; background:var(--blue); color:#fff; font-size:13px; font-weight:700; display:grid; place-items:center; }
  .steps li b { display:block; font-size:14px; } .steps li span { font-size:12px; color:var(--muted); }
  @media (max-width:700px) { .stats, .steps { grid-template-columns:1fr; } }
  /* 협업 흐름 그림 */
  .flow { list-style:none; padding:0; margin:16px 0; display:grid; grid-template-columns:repeat(3,1fr); gap:14px 26px; counter-reset:fl; }
  .flow li { position:relative; padding:16px 16px 16px 52px; border-radius:16px; background:var(--surface); counter-increment:fl; line-height:1.5; }
  .flow li::before { content:counter(fl); position:absolute; left:14px; top:16px; width:26px; height:26px; border-radius:50%; background:var(--blue); color:#fff; font-weight:700; font-size:13px; display:grid; place-items:center; }
  .flow li:not(:nth-child(3n)):not(:last-child)::after { content:"→"; position:absolute; right:-21px; top:50%; transform:translateY(-50%); color:var(--blue); font-weight:800; }
  .flow small { display:block; font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.04em; }
  .flow b { display:flex; align-items:center; gap:6px; font-size:15px; }
  .flow span { display:block; font-size:12px; color:var(--muted); margin-top:2px; }
  .flow em, .auto-key { font-style:normal; font-size:10px; font-weight:700; color:var(--pink); background:var(--pink-l); padding:1px 7px; border-radius:999px; }
  .week { list-style:none; padding:0; margin:0 0 8px; display:flex; position:relative; }
  .week::before { content:""; position:absolute; left:10%; right:10%; top:9px; height:2px; background:var(--line); }
  .week li { flex:1; text-align:center; position:relative; padding-top:26px; }
  .week li::before { content:""; position:absolute; left:50%; top:3px; width:14px; height:14px; margin-left:-7px; border-radius:50%; background:#fff; border:3px solid var(--blue); }
  .week li:first-child::before { border-color:var(--pink); }
  .week b { display:block; font-size:13px; } .week span { font-size:12px; color:var(--muted); }
  @media (max-width:700px) { .flow { grid-template-columns:1fr; } .flow li::after { display:none; } .week { flex-direction:column; gap:10px; } .week::before { display:none; } .week li { text-align:left; padding:0 0 0 24px; } .week li::before { left:0; top:4px; margin:0; } }
  .bar .track { display:flex; flex-direction:column; gap:3px; }
  .bar .track small { font-size:11px; color:var(--muted); }
  /* 홈 화면 Really 캐릭터 */
  .hero > div { position:relative; }
  .hero h1, .hero p { max-width:600px; }
  .hero-pig { position:absolute; right:0; top:50%; transform:translateY(-46%); height:330px; pointer-events:none; }
  @media (max-width:960px) { .hero-pig { height:240px; opacity:.35; } }
  @media (max-width:860px) { .hero { margin:12px 12px 0; padding:40px 24px; } }
  @media (max-width:700px) { .hero-pig { display:none; } }
</style>
</head>

  <li><code>eval()</code> 도입 — 규칙 카드가 코드가 됨</li>
  <li>게이트를 정수 · 문자열로 다루기 — <code>Gate</code> enum 하나가 단일 출처</li>
  <li>한도를 건별로 계산 — 같은 입력에 다른 답</li>
  <li>평가셋 기대값을 규칙 카드에서 뽑기 — 자기가 자기를 채점</li>
  <li>업종코드 앞자리 0 유실 — 문자열 강제</li>
  <li>모델에게 금액 계산 시키기 — 산술은 코드가</li>
  <li>분류 결과를 fixture 로 고정 안 하기 — CI 가 비결정적이 됨</li>
  <li>속성 관문을 조기 종료로 구현 — <code>putAll</code> 이지 <code>return</code> 이 아님</li>
</ol>
<p class="why"><span class="why-label">출처</span> <code>CONTEXT.md</code> 16절 (20개 중 코드 쪽 10개). AI 코딩 에이전트용 지침은 <code>CLAUDE.md</code>.</p>
`],

['09b-Deploy', '9. 배포', `
<p>원본은 <code>docs/deployment.md</code> 입니다. 여기는 흐름만 요약합니다.</p>
<h2>구성</h2>
<ul>
  <li>카테캠 팀 계정의 Ubuntu 24.04 EC2 한 대에서 <code>deploy/compose.yaml</code> 로 PostgreSQL · Redis · 백엔드 · AI · 웹을 띄웁니다.</li>
  <li>도메인은 DuckDNS(<a href="https://ktc4-pusan-4.duckdns.org/" target="_blank">ktc4-pusan-4.duckdns.org</a>), HTTPS 인증서는 Caddy 가 발급합니다.</li>
  <li>보안그룹은 80 · 443 만 엽니다. 서버 접속은 SSH 대신 Session Manager 를 씁니다.</li>
</ul>
<h2>배포 흐름</h2>
<pre><code>develop → release PR (승인 1명 + 백엔드·AI·웹 검사 통과)
  → release push
  → GitHub Actions: 검증 → 이미지 빌드 → ECR 업로드
  → SSM 이 EC2 의 deploy/deploy.sh 에 커밋 SHA 전달
  → 이미지 pull → compose 기동 → Flyway → db/schema.sql · db/rag.sql 적용</code></pre>
<h2>운영</h2>
<table><tr><th style="width:22%">항목</th><th>내용</th></tr>
<tr><td>백업</td><td>매일 03:00 <code>pg_dump</code> 를 S3 로 보냄. 복원은 임시 DB 에서 확인</td></tr>
<tr><td>되돌리기</td><td><code>deploy.sh &lt;이전 SHA&gt; --rollback</code>. Flyway 스키마는 되돌리지 않으므로 스키마 변경은 이전 앱과 호환되게 나눠 배포</td></tr>
<tr><td>로그 · 알림</td><td>백엔드 로그는 CloudWatch Logs, 알람은 디스코드로 (<a href="#06b-Automation">협업 자동화</a>)</td></tr>
<tr><td>주의</td><td>운영에서 <code>docker compose down -v</code> 금지 — DB 볼륨이 지워짐</td></tr></table>
`],

const name = t => t.replace(/^\d+\.\s*/, '');   // 메뉴 번호 떼기
const text = h => h.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
const DESC = {   // 홈 카드 한 줄 설명
  '01-Overview': '무엇을, 누구를 위해 만드는지와 히어로 시나리오',
  '02-Principles': '판정 경로에 LLM이 없는 이유와 6가지 원칙',
  '03-Team': 'PM · 백엔드 · 프론트 · AI 팀원과 자주 쓰는 링크',
  '00-Ground-Rules': '소통 · 회의 · 리뷰 시간과 저장소에서 지킬 것',
  '04-Branch': 'main · develop · release · feature 브랜치의 쓰임',
  '05-Commit': 'type: subject 형식과 타입 목록',
  '06-PR': 'PR 본문 쓰는 법, 머지 규칙, 주간 리뷰 사이클',
  '06b-Automation': 'PR 알림 봇, 승인 필수 룰셋, worklog 자동 작성, CI·배포, 모니터링',
  '06c-Review': '주차별 멘토 리뷰 PR 과 다룬 주제',
  '06d-Docs': 'CONTEXT · docs · worklog · README 에 무엇을 쓰나',
  '07b-API': '리소스 구조, 공통 규칙, 엔드포인트 43개',
  '07c-DB': '테이블 소유 · 적용 순서 · 테이블 24개',
  '07d-FE': '폴더 구조, 목업/실서버 전환, 디자인 규칙',
  '07e-Convention': '백엔드 · AI · 프론트 코드 규칙과 자주 하는 실수',
  '07f-Test': '단위 · 통합 테스트, 판정 평가셋, 린트',
  '09b-Deploy': 'EC2 · compose 구성, release 배포 흐름, 백업 · 롤백',
  '07-Architecture': '입력 검증부터 집계까지, 6관문 판정 흐름',
  '08-Stack': '프론트 · 백엔드 · AI 서버 · DB 구성과 디렉터리',
  '09-Local': '백엔드·프론트 로컬 실행과 테스트 명령',
};
const RELATED = {   // 페이지 끝 "함께 보면 좋은 문서"
  '01-Overview': ['02-Principles', '07-Architecture'],
  '02-Principles': ['07-Architecture', '01-Overview'],
  '03-Team': ['00-Ground-Rules', '06-PR'],
  '00-Ground-Rules': ['06-PR', '06b-Automation'],
  '04-Branch': ['06-PR', '05-Commit'],
  '05-Commit': ['04-Branch', '06-PR'],
  '06-PR': ['06b-Automation', '04-Branch', '00-Ground-Rules'],
  '06b-Automation': ['06-PR', '00-Ground-Rules'],
  '06c-Review': ['06-PR', '06b-Automation'],
  '06d-Docs': ['00-Ground-Rules', '06-PR'],
  '07b-API': ['07c-DB', '07-Architecture'],
  '07c-DB': ['07b-API', '07-Architecture'],
  '07d-FE': ['07b-API', '07e-Convention'],
  '07e-Convention': ['05-Commit', '07f-Test'],
  '07f-Test': ['07e-Convention', '09-Local'],
  '09b-Deploy': ['06b-Automation', '08-Stack'],
  '07-Architecture': ['02-Principles', '08-Stack'],
  '08-Stack': ['09-Local', '07-Architecture'],
  '09-Local': ['08-Stack', '04-Branch'],
};
// 본문의 저장소 경로(<code>docs/x.md</code> 등)를 GitHub 링크로
const REPO = 'https://github.com/kakaotechcampus-4/ktc4-pusan-4';
const repoLink = html => html.replace(/<code>((?:\.github|\.githooks|\.claude|tools|worklog|deploy|docker|eval|rules|profiles|db|docs|backend|frontend|ai)\/[\w.\-\/]*|[\w\-]+\.md)<\/code>/g,
  (_, p) => `<a class="repo" href="${REPO}/${p.endsWith('/') ? 'tree' : 'blob'}/develop/${p}" target="_blank"><code>${p}</code> ↗</a>`);
const flat = DOCS.flatMap(([g, pages]) => pages.map(([id, t, html]) => ({ id, t: name(t), html, g })));
const view = document.getElementById('view');

function home() {
  view.innerHTML = `<div class="hero"><div>
      <p class="k">카카오테크 캠퍼스 4기 · 부산대 4팀 · 초안(데모)</p>
      <h1>AI가 규칙을 만들고,<br><em>규칙이 판정한다</em></h1>
      <p>PreeT는 카드 승인내역을 받아 지출마다 필요경비 인정 여부를 조문 근거와 함께 판정합니다.<br>팀 규칙, 설계 원칙, 실행 방법을 여기 한곳에 모았습니다.</p>
      <a class="btn" href="#${flat[0].id}">문서 읽기 시작 →</a> <a class="btn ghost" href="https://ktc4-pusan-4.duckdns.org/" target="_blank">서비스 열어 보기 ↗</a>
      <img class="hero-pig" src="${PIG_LEFT}" alt="돋보기와 체크리스트를 든 Really"></div></div>
    <div class="home">${DOCS.map(([g]) => `<section><h2>${g}</h2><div class="grid">${
      flat.filter(d => d.g === g).map(d => `<a class="card" href="#${d.id}"><b>${d.t}</b><small>${DESC[d.id] ?? text(d.html).slice(0, 90)}</small></a>`).join('')
    }</div></section>`).join('')}</div>`;
}

function doc(i) {
  const d = flat[i], prev = flat[i - 1], next = flat[i + 1];
  const sib = flat.filter(x => x.g === d.g);
  view.innerHTML = `<div class="page"><article>
      <div class="crumb"><a href="#">홈</a> / ${d.g}</div>
      <h1>${d.t}</h1>
      <div class="sib">${sib.map(x => `<a href="#${x.id}" class="${x.id === d.id ? 'on' : ''}">${x.t}</a>`).join('')}</div>
      ${repoLink(d.html)}
      ${RELATED[d.id] ? `<div class="rel"><p>함께 보면 좋은 문서</p>${RELATED[d.id].map(r => flat.find(x => x.id === r)).map(x => `<a href="#${x.id}"><b>${x.t}</b><small>${DESC[x.id]}</small></a>`).join('')}</div>` : ''}
      <div class="pager">${prev ? `<a href="#${prev.id}"><small>← 이전</small>${prev.t}</a>` : ''}${next ? `<a class="n" href="#${next.id}"><small>다음 →</small>${next.t}</a>` : ''}</div>
    </article><aside class="toc" id="toc"></aside></div>`;
  const hs = [...view.querySelectorAll('article h2')];
  const toc = document.getElementById('toc');
  if (hs.length) toc.innerHTML = '<p>이 페이지에서</p><span class="toc-ind"></span>';
  spy = hs.map(h => {   // 해시는 페이지 이동에 쓰므로 목차는 스크롤만
    const a = document.createElement('a');
    a.textContent = h.textContent;
    a.onclick = () => h.scrollIntoView({ behavior: 'smooth' });
    toc.append(a);
    return [h, a];
  });
}

// 목차에서 지금 읽고 있는 항목 표시: 화면 위쪽을 지난 마지막 제목, 맨 아래면 마지막 항목
let spy = [];
function updateSpy() {
  if (!spy.length) return;
  let k = 0;
  spy.forEach(([h], i) => { if (h.getBoundingClientRect().top <= 120) k = i; });
  if (innerHeight + scrollY >= document.documentElement.scrollHeight - 2) k = spy.length - 1;
  spy.forEach(([, a], i) => a.classList.toggle('on', i === k));
  const a = spy[k][1], ind = document.querySelector('.toc-ind');   // 파란 선을 현재 항목으로 미끄러뜨림
  if (ind) { ind.style.transform = `translateY(${a.offsetTop}px)`; ind.style.height = a.offsetHeight + 'px'; }
}
addEventListener('scroll', updateSpy, { passive: true });

function render(id = location.hash.slice(1)) {
  const i = flat.findIndex(d => d.id === id);
  spy = [];
  i < 0 ? home() : doc(i);
  document.querySelector('.fab').hidden = i < 0;   // 홈에서는 숨김
  const g = i < 0 ? null : flat[i].g;
  document.getElementById('tabs').innerHTML = DOCS.map(([n]) =>
    `<a href="#${flat.find(d => d.g === n).id}" class="${n === g ? 'on' : ''}">${n}</a>`).join('');
  document.title = (i < 0 ? '' : flat[i].t + ' · ') + 'PreeT 팀 문서';
  scrollTo(0, 0);
  updateSpy();
}
// 내부 링크는 직접 처리: 앱 파일 미리보기처럼 주소(#) 이동이 막힌 곳에서도 동작
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  const id = a.getAttribute('href').slice(1);
  try { history.pushState(null, '', '#' + id); } catch {}   // 주소 갱신은 되는 곳에서만
  render(id);
});
addEventListener('popstate', () => render());
render();
</script>
