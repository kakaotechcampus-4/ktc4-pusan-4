['개요', [
['01-Overview', '1. 프로젝트 개요', `
<p>1인 개인사업자의 카드 승인내역을 받아, 지출 건별로 <b>필요경비 인정 여부를 조문 근거와 함께 판정</b>하는 서비스입니다. <a href="https://ktc4-pusan-4.duckdns.org/" target="_blank">서비스 바로가기 ↗</a></p>
<blockquote>"AI가 규칙을 만들고, 규칙이 판정한다."</blockquote>
<h2>AI가 들어가는 곳</h2>
<p>판정은 결정론적 룰 엔진이 합니다. AI는 판정 전 <b>가맹점 카테고리 분류</b>, 그리고 <b>신규 규칙 카드 생성</b>과 <b>에이전트 비서 Really</b> 두 곳에 있습니다.</p>
<blockquote>비서는 판정하지 않는다. 제안은 비서가, 확정은 사용자가, 판정은 룰엔진이 한다. (<code>docs/agent-secretary.md</code>)</blockquote>
<h2>문제 정의</h2>
<p>1인 개인사업자는 같은 지출도 업종·매출·직원 유무에 따라 경비 인정 여부가 갈리는데, 자기 기준을 확인할 방법이 없어 5월에 1년 치를 놓고도 애매한 것은 그냥 빼는 식으로 넘어갑니다.</p>
<h2>포지셔닝</h2>
<ul>
  <li><b>세무사를 대체하지 않는다.</b> 세무사에게 맡기기 전에 필요한 자료와 질문 목록을 취합해 준다.</li>
  <li>신고·제출·환급 대행, 세액 확정 제시, 절세 컨설팅을 하지 않는다.</li>
</ul>
<h2>페르소나</h2>
<ul>
  <li>1인 IT 사업자 + 강의 병행, 30대 (업종코드 940909, 직원·물적시설 없음)</li>
  <li>연매출 8,200만원 → 복식부기 의무자</li>
  <li>사업용 카드 1장 + 개인 카드 2장 혼용, 자택 겸 작업실</li>
</ul>
<h2>히어로 시나리오</h2>
<p><b>"맥북 350만원 → 올해 경비는 583,333원"</b></p>
<pre><code>100만원 초과 → 자산 처리, 내용연수 5년 정액법
3월 취득 → 10개월분: 3,500,000 ÷ 5 × 10/12 = 583,333원</code></pre>
<h2>일정</h2>
<table><tr><th>항목</th><th>내용</th></tr>
<tr><td>기간</td><td>2026-09 ~ 2026-11 (11주)</td></tr>

`],
['02-Principles', '2. 핵심 설계 원칙', `
<h3>원칙 1. 판정 경로에 LLM이 없다</h3>
<pre><code>카드내역 → 정규화 → [모델: 카테고리 분류] → judge() → 판정
                        ↑ 확률적              ↑ 순수 함수 (같은 입력 → 같은 출력)</code></pre>
<p><code>judge()</code> 안에는 LLM·외부 API·랜덤·현재 시각 조회가 없습니다. 분류가 틀리면 규칙 매칭이 실패해 '확인 필요'로 떨어질 뿐, 틀린 판정이 나가지 않습니다.</p>
<blockquote>최악의 결과가 틀린 답이 아니라 질문 하나 더가 되는 구조.</blockquote>
<h3>원칙 2. 근거를 지어내느니 비워둔다</h3>
<p>규칙 카드가 없으면 판정하지 않고 <code>is_inference: true</code>로 표시합니다. 확정 판정(가능/불가)에는 반드시 조문 ID가 붙습니다.</p>
<h3>원칙 3. RAG는 판정 경로에 없다</h3>

<ol class="flow"><li><small>Notion</small><b>할 일 등록</b><span>파트 보드에 할 일 추가, 시작하면 "진행 중"</span></li><li><small>Git</small><b>브랜치에서 작업<em>자동</em></b><span><code>feature/…</code> 브랜치, push 때 worklog 자동 작성</span></li><li><small>GitHub</small><b>PR 올리기</b><span>PR 템플릿 4칸 채우기</span></li><li><small>Discord</small><b>바로 알림<em>자동</em></b><span>새 PR · 리뷰어 멘션, 24시간 지나면 다시 알림</span></li><li><small>GitHub</small><b>리뷰 · 승인<em>자동</em></b><span>1명 이상 승인해야 머지 버튼이 열림</span></li><li><small>GitHub</small><b>PM이 머지</b><span><code>develop</code>에 합쳐지고 노션은 "완료"</span></li></ol>
<p class="board-sub">그리고 매주 멘토 리뷰로</p>
<ol class="week"><li><b>수 16:00</b><span>파트별 정리 → PM</span></li><li><b>수 18:00</b><span>develop → main PR</span></li><li><b>목 22:00</b><span>멘토 리뷰</span></li><li><b>토 10:00</b><span>재리뷰 요청</span></li><li><b>일 23:59</b><span>main 머지</span></li></ol>
<h2>PR · 리뷰 알림 (AI 도구로 직접 만든 디스코드 봇)</h2>
<p>팀이 AI 코딩 도구를 활용해 직접 만든 알림 봇입니다. PR이나 Issue에 변화가 생기면 팀 디스코드 채널로 바로 알림이 옵니다. GitHub에 들어가 확인하지 않아도 리뷰 요청을 놓치지 않습니다.</p>
<table><tr><th style="width:34%">이럴 때</th><th>알림</th></tr>
<tr><td>PR이 열리거나 리뷰 가능 상태가 됨</td><td>새 PR 알림 + 지정된 리뷰어 멘션 (2분 기다렸다가 한 번에 묶어서 보냄)</td></tr>
<tr><td>나중에 리뷰어가 추가됨</td><td>추가된 리뷰어만 따로 멘션</td></tr>
<tr><td>리뷰 · 댓글이 달림</td><td>PR 작성자 멘션</td></tr>
<tr><td>리뷰 요청 후 24시간 동안 리뷰 없음</td><td>리뷰어 멘션, 그 뒤로 12시간마다 다시 알림</td></tr>
<tr><td>Issue 생성 · 담당자 지정</td><td>새 Issue 알림, 담당자 멘션</td></tr></table>
<p class="why"><span class="why-label">파일</span> <code>.github/workflows/pr-discord-notify.yml</code>, <code>.github/workflows/pr-review-reminder.yml</code>, 로직은 <code>tools/pr_discord_bot.py</code>. 운영진이 준 멘토 리뷰 알림(<code>notify-discord</code>)과 별개로, 팀 내부 PR(<code>feature/*</code> → <code>develop</code>)용으로 팀이 만들었습니다.</p>

<h2>승인 없이는 머지되지 않는다 (GitHub 룰셋)</h2>
<p>규칙을 사람의 약속에만 맡기지 않고 GitHub 설정으로 강제합니다.</p>
<table><tr><th style="width:18%">브랜치</th><th>머지 조건</th></tr>
<tr><td><code>develop</code></td><td>PR로만 머지, <b>승인 1명 이상</b>, 강제 push 금지</td></tr>
<tr><td><code>main</code></td><td>PR로만 머지, <b>승인 1명 이상</b> + 코드 오너(멘토) 리뷰, 강제 push · 삭제 금지</td></tr>
<tr><td><code>release</code></td><td><b>승인 1명 이상</b> + 백엔드 · AI · 웹 검사 통과, <code>develop</code>에서 온 PR만 허용, 강제 push · 삭제 금지</td></tr></table>
<p class="why"><span class="why-label">참고</span> 누가 머지 버튼을 누르는지까지는 막지 않습니다. "PM이 머지"는 팀 약속입니다.</p>

<h2>push 할 때마다 작업 기록 (Claude Code 활용)</h2>
<p>코드를 바꾼 push에는 작업 기록(<code>worklog/</code>)이 반드시 함께 올라가야 합니다. 기록이 없으면 push가 막히고, Claude Code가 이번 push 분량의 변경을 읽어 기록을 대신 작성합니다.</p>
<pre><code>git push
  → pre-push 훅: "worklog 문서가 없습니다" 로 막음
  → Claude Code 훅이 감지 → /worklog 스킬 실행
  → 변경 내용을 읽고 worklog/{fe|be|ai|etc}/날짜-주제.md 작성 · 커밋
  → 다시 push</code></pre>
<p class="why"><span class="why-label">파일</span> <code>.githooks/pre-push</code>, <code>.claude/hooks/push-nudge.sh</code>, <code>.claude/skills/worklog/SKILL.md</code></p>

<h2>CI · 배포</h2>
<table><tr><th style="width:30%">워크플로</th><th>하는 일</th></tr>
<tr><td>Backend CI</td><td>백엔드·규칙 카드·평가셋이 바뀐 PR에서 단위 테스트와 통합 테스트 실행</td></tr>
<tr><td>AI CI</td><td><code>ai/</code>가 바뀐 PR에서 ruff 검사와 pytest 실행</td></tr>

<tr><td>AWS release</td><td><code>release</code> PR에서 백엔드·AI·웹을 빌드·테스트하고, 머지되면 이미지를 ECR에 올려 SSM으로 EC2에 배포</td></tr>
<tr><td>Release source</td><td><code>release</code>는 <code>develop</code>에서 온 PR만 받도록 검사</td></tr></table>
<p class="why"><span class="why-label">참고</span> 규칙 카드 판정은 평가셋 60건(<code>eval/</code>)으로 회귀 검사합니다. 기대값은 규칙 카드가 아니라 조문에서 뽑습니다.</p>

<h2>서버에서 정기적으로 도는 작업</h2>
<table><tr><th style="width:30%">언제</th><th>하는 일</th></tr>

const REPO = 'https://github.com/kakaotechcampus-4/ktc4-pusan-4';
const repoLink = html => html.replace(/<code>((?:\.github|\.githooks|\.claude|tools|worklog|deploy|docker|eval|rules|profiles|db|docs|backend|frontend|ai)\/[\w.\-\/]*|[\w\-]+\.md)<\/code>/g,
  (_, p) => `<a class="repo" href="${REPO}/${p.endsWith('/') ? 'tree' : 'blob'}/develop/${p}" target="_blank"><code>${p}</code> ↗</a>`);
const flat = DOCS.flatMap(([g, pages]) => pages.map(([id, t, html]) => ({ id, t: name(t), html, g })));
const view = document.getElementById('view');

function home() {
  view.innerHTML = `<div class="hero"><div>
      <p class="k">카카오테크 캠퍼스 4기 · 부산대 4팀 · 초안(데모)</p>

      <a class="btn" href="#${flat[0].id}">문서 읽기 시작 →</a> <a class="btn ghost" href="https://ktc4-pusan-4.duckdns.org/" target="_blank">서비스 열어 보기 ↗</a>
      <img class="hero-pig" src="${PIG_LEFT}" alt="돋보기와 체크리스트를 든 Really"></div></div>
    <div class="home">${DOCS.map(([g]) => `<section><h2>${g}</h2><div class="grid">${
      flat.filter(d => d.g === g).map(d => `<a class="card" href="#${d.id}"><b>${d.t}</b><small>${DESC[d.id] ?? text(d.html).slice(0, 90)}</small></a>`).join('')
    }${g === '협업 가이드' ? `<div class="card-pig"><img src="${PIG_RIGHT}" alt=""></div>` : ''}</div></section>`).join('')}</div>`;
}

function doc(i) {

      <h1>${d.t}</h1>

  const toc = document.getElementById('toc');
  if (hs.length) toc.innerHTML = '<p>이 페이지에서</p><span class="toc-ind"></span>';
  spy = hs.map(h => {   // 해시는 페이지 이동에 쓰므로 목차는 스크롤만
    const a = document.createElement('a');
    a.textContent = h.textContent;
    a.onclick = () => h.scrollIntoView({ behavior: 'smooth' });
    toc.append(a);
    return [h, a];
  });
}

// 목차에서 지금 읽고 있는 항목 표시: 화면 위쪽을 지난 마지막 제목, 맨 아래면 마지막 항목
let spy = [];
function updateSpy() {
  if (!spy.length) return;
  let k = 0;
  spy.forEach(([h], i) => { if (h.getBoundingClientRect().top <= 120) k = i; });
  if (innerHeight + scrollY >= document.documentElement.scrollHeight - 2) k = spy.length - 1;
  spy.forEach(([, a], i) => a.classList.toggle('on', i === k));
  const a = spy[k][1], ind = document.querySelector('.toc-ind');   // 파란 선을 현재 항목으로 미끄러뜨림
  if (ind) { ind.style.transform = `translateY(${a.offsetTop}px)`; ind.style.height = a.offsetHeight + 'px'; }
}
addEventListener('scroll', updateSpy, { passive: true });

function render(id = location.hash.slice(1)) {
  const i = flat.findIndex(d => d.id === id);
  spy = [];
  i < 0 ? home() : doc(i);
  document.querySelector('.fab').hidden = i < 0;   // 홈에서는 숨김
  const g = i < 0 ? null : flat[i].g;
  document.getElementById('tabs').innerHTML = DOCS.map(([n]) =>
    `<a href="#${flat.find(d => d.g === n).id}" class="${n === g ? 'on' : ''}">${n}</a>`).join('');
  document.title = (i < 0 ? '' : flat[i].t + ' · ') + 'PreeT 팀 문서';
  scrollTo(0, 0);
  updateSpy();
}
// 내부 링크는 직접 처리: 앱 파일 미리보기처럼 주소(#) 이동이 막힌 곳에서도 동작
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  const id = a.getAttribute('href').slice(1);
  try { history.pushState(null, '', '#' + id); } catch {}   // 주소 갱신은 되는 곳에서만
  render(id);
});
addEventListener('popstate', () => render());
render();
</script>
</body>
</html>
