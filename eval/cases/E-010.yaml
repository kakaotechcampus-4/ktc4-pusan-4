근거: "§27① 통상성은 업종에 따라 갈린다. 한식음식점업에서 클라우드 이용료의 사업 관련성은 명확하지 않다. 업종 기준(프로파일)이 없는 업종에 IT 사업자 기준을 적용해 가능으로 확정하면 오탐."
