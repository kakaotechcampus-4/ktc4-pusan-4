근거: "시행령 §55①11의3은 국민건강보험·노인장기요양보험 지역가입자 보험료만 필요경비로 열거한다. 국민연금 보험료는 필요경비가 아니라 종합소득공제(연금보험료공제) 대상이다. 가능으로 판정하거나 건강보험 조항을 인용하면 오탐."
