근거: "§33①3 가산금은 '국세징수법이나 그 밖에 조세에 관한 법률에 따른' 가산금이다. 과태료 체납 가산금은 조세 법률 가산금이 아니라 3호를 인용하면 근거 오적용. 2호·12호 어느 쪽이든 불산입이라 인용 호는 채점하지 않는다."
