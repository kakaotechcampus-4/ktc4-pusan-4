근거: "사업 사용분은 필요경비·가사분은 §33①5 불산입(작업실 비율 안분). 다만 시행령 §61①1 후단은 '제98조제2항제2호 단서에 해당하는 주택에 관련된 경비는 가사 관련 경비로 본다'고 해, 자택 겸 작업실이 여기 해당하면 안분 자체가 막힌다. 그 단서(제98조제2항제2호 단서)는 직계존비속에게 주택을 무상으로 내주고 그들이 실제 거주하는 경우라, 본인 집의 작업실과는 관계없다고 보고 보류를 풀었다(2026-10-28, 검수 전 해석). 금액은 8만원 × 작업실 비율 20%. 작업 공간이 따로 나뉘지 않으면 E-059 처럼 확인필요다(2026-11-01)."
