근거: "사업 사용분은 필요경비·가사분은 §33①5 불산입(작업실 비율 안분). 다만 시행령 §61①1 후단은 '제98조제2항제2호 단서에 해당하는 주택에 관련된 경비는 가사 관련 경비로 본다'고 해, 자택 겸 작업실이 여기 해당하면 안분 자체가 막힌다."
