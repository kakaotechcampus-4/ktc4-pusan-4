근거: "시행령 §67⑦4는 '개인용 컴퓨터(주변기기 포함)'를 금액 제한 없이 사용한 해에 필요경비로 계상한 경우 산입한다. 맥북은 사무용품으로 들어오므로 R-241 에서 'PC·휴대폰·가구' 를 고르면 즉시 경비가 가능하다(그해 계상 요건). 예전 기대값(자산 강제, 5년 상각 583,333원)은 이 특례를 반영하지 않은 히어로 시나리오였다. 세무사 자문(2026.09)·#171."
