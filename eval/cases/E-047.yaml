근거: "§34① 사업과 직접 관계없이 무상 지출은 기부금이다(기업업무추진비 §35 아님 — 인용하면 오적용). 특례·일반기부금 단체면 §34②③ 한도 내 산입, 아니면 §34④ 불산입이라 단체 지정 여부를 모르면 확정할 수 없다."
