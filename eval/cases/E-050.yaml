근거: "사업과 무관한 식사는 §33①5 가사경비 또는 시행령 §78①4 '사업과 관련 없이 지출한 기업업무추진비'(§33①13)로 불산입. 어느 호든 한도 내 산입되는 §35 기업업무추진비로 처리해 버킷에 넣으면 오적용이라 인용 호 대신 제외·버킷 부재만 채점한다."
