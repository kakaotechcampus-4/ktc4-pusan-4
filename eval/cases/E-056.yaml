근거: "시행규칙 §95의3 4호의 증빙 예외는 '국외에서 재화·용역을 공급받은 경우'다. 국내 사업자와의 거래는 §160의2 수취 의무가 그대로 있고 카드전표로 충족된다. 해외 SaaS 예외가 국내 거래로 새면 안 된다(E-011·E-012의 대조군)."
