근거: "사업분은 필요경비(§27①), 가사분은 §33①5 불산입이다. 세무사 자문(2026.09, 보고서 Q1): 자택은 업무공간이 물리적으로 구획되어 있는지가 중요하고 구획이 명확하지 않으면 인정받기 어렵거나 낮은 비율만 반영한다. 문진 비율(20%)이 있어도 낮은 비율을 정할 근거가 없어 금액을 내지 않고 세무사에게 넘긴다. 가능 + 20% 로 확정하면 오탐."
