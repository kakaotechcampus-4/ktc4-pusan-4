  비고: "카드사가 한 달치 지하철 이용을 월말 날짜로 묶은 행. 2026-01-31 은 토요일이다"
기대:
  판정: 확인필요
채점: { 치명: true }
근거: "강의 출장이면 §27① 통상 경비, 개인 이동이면 §33①5 가사경비(E-032와 같다). 합산 행의 날짜는 실제 이용일이 아니라 묶음 기준일이라 주말 이동으로 볼 근거가 없다. 목적을 모르니 확정할 수 없고, 주말이라며 불가로 확정하면 오판."
