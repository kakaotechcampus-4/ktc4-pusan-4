# 업종 프로파일 · 940909 인적용역 (IT 개발 + 강의 병행)
#
# ⚠️ 이 파일은 현재 어떤 코드도 읽지 않는다.
#    RuleCard 에 verdict_by_profile 필드가 없고 프로파일 로더도 없다.
#    지금은 G2 (b) 카드가 verdict 를 직접 들고 있고, 이 파일은 그 값의 근거 문서다.
#    백엔드가 verdict_by_profile 을 지원하면 카드에서 match.industry 를 지우고
#    판정을 이 파일로 옮긴다. 그때까지 두 곳이 어긋나지 않게 같이 고쳐야 한다.
#
# ⚠️ 자동 검증이 없다. validate_rules.py 도 RuleCardLoader 도 이 파일을 보지 않아
#    카테고리 키 오타를 아무도 잡지 못한다. 키는 rules/categories.yaml 에서 그대로 옮겼다.
#
# 값: 통상 / 비통상 / 조건부   (칸이 없으면 '미기입' = 확인필요. 이게 안전한 기본값이다)
#
# 전제 (페르소나)
#   - 직원 없음 -> 복리후생비·경조사비 분기 없음. 직원있음_오버라이드 블록을 두지 않는다
#   - 자택 겸 작업실 -> 통신·수도광열이 안분 대상
#   - 업무용 차량 없음

industry_code: "940909"          # 문자열 강제. 앞자리 0 있는 업종코드에서 유실 방지
label: 인적용역 · IT 개발 + 강의

통상성:
  # ── C 담당 (G2 (b) 카드가 이 값을 쓴다) ──────────────────
  해외SaaS:     통상        # AWS·GitHub 등 개발 인프라
  구독서비스:   조건부      # 업무 관련성 진술이 필요하다 (Netflix 와 Figma 가 같은 칸)
  교육:         통상        # 직무 역량 강의·교재
  수도광열:     조건부      # 자택 겸 작업실 -> 면적 기준 안분 (G3)
  온라인쇼핑:   조건부      # 품목을 모르면 판정할 수 없다

  # ── A 담당 카테고리 (초안. 담당자 확인 필요) ──────────────
  국내SW:       통상
  도서:         통상        # 기술서적
  광고:         통상        # 본인 서비스 홍보
  사무용품:     통상        # 100만원 초과는 G4 자산
  통신:         조건부      # 전용 회선이면 100%, 공용이면 확인필요 (G3)
  금융:         조건부      # 사업용 계좌 수수료는 통상, 개인 보험은 비통상

  # ── B 담당 카테고리 (초안. 담당자 확인 필요) ──────────────
  카페:         조건부      # 거래처 미팅이면 기업업무추진비, 혼자 작업이면 갈린다
  음식점:       조건부      # 대표자 본인 식대는 불산입
  음식배달:     비통상      # 자택 배달은 본인 식대로 본다
  편의점:       조건부      # 소모품과 개인 간식이 섞인다
  여비교통:     조건부      # 강의 출장이 있어 업무 이동이 실재하나 개인 이동과 혼재
  의료:         비통상      # 개인 의료비
  게임:         비통상
  여가:         비통상
  미용:         비통상
  생활용품:     비통상      # 1인 인적용역에서는 개인 소비로 추정

# 칸을 두지 않은 카테고리와 그 이유
#   조세 / 지자체_과태료 / 경찰청_범칙금
#       G1 에서 차단되어 G2 에 도달하지 않는다. 통상성 값이 의미가 없다
#   차량
#       범위 밖(R-070)이 priority 700 으로 먼저 잡는다. 별도 제도라 핸드오프한다
#   PG_미상
#       업종 통상성 문제가 아니라 가맹점이 불명한 문제다. 되묻기로 간다
#   기타
#       현재 이 값을 부여하는 분류 규칙이 없다 (normalize.py 의 '기타'는 리포트 라벨이다)
