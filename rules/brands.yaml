version: 1

# 브랜드 사전 — T4 1겹(점포 -> 브랜드).
#
# 정규화(rules/normalize.yaml 의 resolve_brand 단계)가 이 파일을 읽어 상호 앞부분을
# 브랜드와 대조한다. 맞으면 norm_key 를 브랜드 키로 모으고, 뒤는 지점으로 뗀다.
# 기준은 docs/labeling_guide.md 1층(T5)이다.
#
# - 키는 회사가 아니라 브랜드다. 하위 업태(예: ○○익스프레스)는 별도 브랜드로 둔다.
#   여기 없는 하위 업태는 부모 브랜드에 붙지 않는다 — 뒤가 지점 모양이 아니면 떼지 않는다.
# - aliases 는 카드 전표에 실제로 찍히는 표기다. 공백을 뺀 대문자로 앞부분을 대조한다.
#   긴 표기부터 대조하므로 'BHC치킨' 이 'BHC' 보다 먼저 걸린다.
# - category 는 2겹(브랜드 -> 카테고리)이라 이번 범위가 아니다. 비워 둔다.
#
# 시드 30개: 상권정보 점포 수 상위 체인(PR #45 / T4 착수 조사). 개인 상점명은 넣지 않는다.

brands:
