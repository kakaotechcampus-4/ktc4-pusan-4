# G1 · 소득세법 §33①4 — 징수의무 불이행으로 납부한 세액
#
# 원천징수 의무를 이행하지 않아 대신 납부하게 된 세액이다.
# 페르소나(직원 없음)에서는 드물지만, 외주 인적용역 대가를 지급하면서
# 원천징수를 빠뜨린 경우에 발생한다.
#
# ⚠️ 키워드에 '원천세'를 넣지 말 것. "3월분 급여원천세 납부"는 정상 납부인데
#    G1 은 카드 verdict 와 무관하게 불가를 확정하고 G2 에 내려가지 않는다.
#    §33①4 는 징수의무를 '불이행해서' 대신 낸 세액이라 정상 납부에는 닿지 않는다.
#    불이행이 문자열로 드러나는 경우만 남기고, 나머지 원천세 결제는 R-071(범위 밖)이
#    확인필요로 받아 세무사에게 넘긴다.
