# G1 · 소득세법 §33①2 — 벌금·과료·과태료
#
# ⭐ 이 카드의 priority(960)가 R-005(법령위반 공과금, §33①12, 920)보다 높아야 한다.
#    주차위반 과태료는 2호와 12호에 둘 다 해당하는데, 더 구체적인 2호를 인용해야 한다.
#    G1 은 정렬 후 첫 매치에서 종료하므로 이 숫자가 곧 인용 조문을 결정한다.
#
# ⚠️ keyword 를 같이 걸지 않는다. match 조건은 전부 AND 라,
#    category + keyword 를 함께 쓰면 "지자체_과태료로 분류됐지만 상호 원문에
#    '과태료'가 없는 건"이 빠져나간다. 지금은 keyword_rules 가 그 단어로만
#    분류해 무해하지만, 시드 사전(T4)이 생기면 조용히 누락된다.
#
# ⚠️ 경찰청_범칙금은 categories.yaml enum 에 있으나 현재 이 값을 부여하는
#    분류 규칙이 없다(keyword_rules 가 범칙금까지 지자체_과태료로 보낸다).
#    분류기가 고쳐지면 이 카드가 그대로 받도록 미리 넣어 둔다.
