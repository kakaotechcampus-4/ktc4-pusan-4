# G5 · 소득세법 §160의2② — 3만원 초과 지출의 적격증빙과 증빙불비 가산세
#
# 이 관문은 판정을 바꾸지 않는다. 증빙이 없어도 경비는 인정되고(verdict 는 G2 가 정한
# 값 그대로), 대신 "얼마의 가산세가 붙는지"를 속성으로 남긴다. CONTEXT §G5 의
# "가능이지만 가산세 위험이라는 제3의 상태" 가 이 자리다. 그래서 verdict 를 두지 않는다.
#
# 3만원 기준의 출처는 시행령 §208의2①1 "거래건당 금액(부가가치세를 포함한다)이
# 3만원 이하인 경우"다. 증빙 의무는 3만원 초과부터라 amount_min 은 30001 이다.
#
# 가산세는 §81조의6①, 미수취 금액의 100분의 2다. 카드는 '율'만 싣고 금액은 싣지 않는다 —
# 산술은 집계 단계의 코드가 한다(CONTEXT §16 "모델에게 금액 계산 시키기" 금지).
#
# "3만원 초과라 증빙이 필요하다"는 amount_min 만으로 확정되는 사실이라 attributes 에 둔다.
# 답에 따라 갈리는 건 수취 여부와 가산세뿐이므로 그쪽만 되묻기 effect 로 남긴다.
#
# ⚠️ 질문 자체는 여전히 나간다. 입력이 카드 승인내역인 동안은 답이 거의 항상 '받아둠'이라
#    과잉 질문이고, 없애려면 매출전표를 적격증빙으로 자동 인정하는 별도 결정이 필요하다.
#
# ⚠️ §81의6① 은 소규모사업자를 가산세 대상에서 제외한다(직전 과세기간 수입금액
#    4,800만원 미만 등). UserContext 에 수입금액이 없어 카드가 이를 가릴 수 없으므로,
#    가산세_대상 이 true 여도 화면에서 "소규모사업자면 제외"를 함께 보여야 한다.
#    이 단서를 빼고 금액만 띄우면 과대 통지가 된다.
#
# ⚠️ 경조금 20만원 특례(시행령 §83②1)는 이 카드가 모른다. 4만원짜리 경조금은
#    여기 매칭되어 증빙을 묻는데, 실제로는 증빙 없이 인정된다. 별도 카드를 두면
#    두 카드가 동시 매칭되어 같은 속성 키에 다른 값이 들어가 mergeAttributes 가
#    예외를 던진다. match 에 exclude_keyword 나 카드 억제 기제가 필요하다.
