# G5 · 소득세법 §160의2② — 3만원 초과 지출의 적격증빙과 증빙불비 가산세
#
# 이 관문은 판정을 바꾸지 않는다. 증빙이 없어도 경비는 인정되고(verdict 는 G2 가 정한
# 값 그대로), 대신 "얼마의 가산세가 붙는지"를 속성으로 남긴다. CONTEXT §G5 의
# "가능이지만 가산세 위험이라는 제3의 상태" 가 이 자리다. 그래서 verdict 를 두지 않는다.
#
# 3만원 기준의 출처는 시행령 §208의2①1 "거래건당 금액(부가가치세를 포함한다)이
# 3만원 이하인 경우"다. 증빙 의무는 3만원 초과부터라 amount_min 은 30001 이다.
#
# 가산세는 §81조의6①, 미수취 금액의 100분의 2다. 카드는 '율'만 싣고 금액은 싣지 않는다 —
# 산술은 집계 단계의 코드가 한다(CONTEXT §16 "모델에게 금액 계산 시키기" 금지).
#
# "3만원 초과라 증빙이 필요하다"는 amount_min 만으로 확정되는 사실이라 attributes 에 둔다.
#
# 카드매출전표는 적격증빙으로 자동 인정한다(v2). 그래서 묻지 않고 속성을 고정으로 싣는다.
#   - 소득세법 §160의2②3: 「여신전문금융업법」에 따른 신용카드매출전표가 받아야 할 증명서류다.
#   - 시행령 §208의2④1: 신용카드업자에게서 받은 월별이용대금명세서를 보관하면 매출전표를 수취·보관한
#     것으로 본다. 입력이 카드 승인내역이면 그 카드의 명세서가 있다.
#   - 입력은 카드 승인내역뿐이다. 거래에 결제 수단 필드가 없고, 거래는 upload_batch(카드 파일 업로드)로만 생긴다.
# v1 은 "적격증빙을 받아두셨나요?" 를 물었는데, 카드 승인내역에서는 답이 항상 '받아둠'이라 과잉 질문이었다
# (637ef19 커밋 주석이 남긴 "매출전표 자동 인정" 결정을 반영했다).
#
# ⚠️ 현금·계좌이체 입력이 생기면 이 카드가 다시 물어야 하는 자리다. 그때는 결제 수단으로 match 를 나누고
#    현금·이체 쪽에 v1 의 질문(받아둠 → 증빙수취 true·가산세_대상 false / 없음 → 증빙수취 false·
#    가산세_대상 true·가산세율 0.02)을 되살린다. 카드 자체를 지우지 않는 이유다.
#
# 별도 검토(이번엔 반영하지 않음 — 묻지 않게 되어 결과가 같다):
#   - 시행령 §208의2①4: 국내사업장이 없는 비거주자·외국법인과의 거래(해외 결제, AWS 등)는 수취 의무 예외
#   - 시행령 §208의2①3: 금융·보험용역은 수취 의무 예외
#   지금은 이 거래에도 '카드매출전표' 속성이 붙는다. 수취 의무가 없다는 표시가 필요해지면 따로 나눈다.
#
# ⚠️ §81의6① 은 소규모사업자를 가산세 대상에서 제외한다(직전 과세기간 수입금액
#    4,800만원 미만 등). UserContext 에 수입금액이 없어 카드가 이를 가릴 수 없으므로,
#    가산세_대상 이 true 여도 화면에서 "소규모사업자면 제외"를 함께 보여야 한다.
#    이 단서를 빼고 금액만 띄우면 과대 통지가 된다.
#
# ⚠️ 경조금 20만원 특례(시행령 §83②1)는 이 카드가 모른다. 4만원짜리 경조금은
#    여기 매칭되어 증빙을 묻는데, 실제로는 증빙 없이 인정된다. 별도 카드를 두면
#    두 카드가 동시 매칭되어 같은 속성 키에 다른 값이 들어가 mergeAttributes 가
#    예외를 던진다. match 에 exclude_keyword 나 카드 억제 기제가 필요하다.
id: R-060
version: 2
gate: G5
priority: 500
effective_period: { start: 2024-01-01, end: null }
match:
  amount_min: 30001
citations:
  - { id: 소득세법-160의2-2, verified: true }
  - { id: 소득세법시행령-208의2-1-1, verified: true }
  - { id: 소득세법시행령-208의2-4, verified: true }
  - { id: 소득세법-81의6-1, verified: true }
attributes:
  증빙필요: true
  증빙수취: true
  증빙: 카드매출전표
  가산세_대상: false
