# G5 · 주말 식대 결제 소명 플래그 — 판정을 바꾸지 않는다
#
# 출처는 조문이 아니라 세무사 실무 질의응답(2026-09) Q2·Q16 이다. 주말·공휴일 식대 결제는
# '개인 식사' 가능성을 시사해 더 엄격하게 되묻는 신호일 뿐, 불인정 기준이 아니다.
# 요일로 경비를 막는 조문이 없으므로 verdict·citations 를 두지 않는다(로더가 요일 카드의
# verdict 를 거부한다). 소득세법·시행령·시행규칙 원문(시행 2026-07-01)에서 휴일·주말·야간이
# 나오는 조문은 §12·시행령 §17(근로자 야간·휴일근로 급여 비과세)뿐이다.
# 토요일 거래처 미팅은 평일과 똑같이 R-300·R-301·R-302 되묻기로 간다.
#
# 카테고리는 Q2 가 다루는 식대(업무미팅 vs 개인 식사)로 한정한다. 음식배달은 Q2 예시엔
# 없지만 같은 식대이고 R-301 과 계약이 같다. 넣지 않은 것:
#   - 경조사: 결혼식·장례는 주말이 정상이라 플래그가 잘못된 의심을 만든다
#   - 구독·통신·임차료 등 정기결제, 해외SaaS·온라인쇼핑: 결제 요일이 사용과 무관하다
#   - 여비교통·숙박: 보고서가 주말 신호를 식대에서만 말했고, 페르소나(IT+강의)는
#     주말 강의 출장이 흔해 잡음이 크다. 세무사 추가 검토는 불가해 근거 없이 넓히지 않는다
#
# 업종 조건은 없지만 사실상 940909 에만 붙는다. G2 식대 카드가 940909 로 묶여 있어
# 다른 업종은 G2 미매칭에서 끝나고 이 카드까지 오지 않는다.
