# G2 · 수도광열 — 프로파일 940909 통상성[수도광열] = 조건부 (확인필요 + 되묻기)
#
# 자택 겸 작업실이라 전기·수도·가스가 사업과 가사에 섞인다.
# 되묻기로 전용/겸용을 가르고, 겸용이면 작업 공간이 따로 나뉘는지까지 묻는다.
# 나뉘면 가능으로 두고 `안분: 작업공간비율` 을 남긴다. 금액은 금액 산정이 문진의 작업공간
# 비율(homeOfficeRatio)로 나눈다. 문진에 비율이 없으면 엔진이 확인필요로 둔다(#65 결정 2번, 2026-10-28).
# 나뉘지 않으면 확인필요(세무사 판단)다. 세무사 자문(2026.09, 보고서 Q1): 자택은 업무공간이
# 물리적으로 구획되어 있는지가 중요하고, 구획이 명확하지 않으면 인정받기 어렵거나 낮은 비율만
# 반영한다. 낮은 비율을 우리가 정할 근거가 없어 금액을 내지 않고 넘긴다(#65 결정 2번 "낮은 비율
# 또는 불인정", 2026-11-01). v2 의 답 "자택 겸용" 은 새 선택지와 맞지 않아 다음 판정에서 다시 묻는다.
#
# ⚠️ 우리가 비율을 제안하지 않는다. "30%로 하세요"는 세무 조언이고 스펙아웃한
#    절세 컨설팅에 걸린다. 비율은 사용자가 문진에 적은 값만 쓴다.
#
# ⚠️ fact_type 을 R-101 의 '전용여부'와 다른 이름으로 둔다. 둘 다 group_by 가
#    merchant_norm 이라 이름까지 같으면 (scope_key, fact_type) 이 겹치는데,
#    선택지 어휘가 서로 다르다(사업 전용/자택 겸용 vs 업무 전용/개인 전용/혼용).
#    겹치면 한쪽 답이 다른 쪽 질문을 영영 pending 으로 만들고, 답을 쓰면 서로의
#    판정을 뒤집는다. R-101 헤더가 정해둔 규칙을 그대로 따른다.
#
# citations 는 평가 골든셋 RC-003 이 이 카테고리에 기대하는 조문(§33①5, 시행령 §61①)에
# 전용일 때의 근거(§27①)를 더한 것이다.
