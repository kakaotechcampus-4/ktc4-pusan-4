# G2 · 온라인쇼핑 — 프로파일 940909 통상성[온라인쇼핑] = 조건부 (확인필요 + 되묻기)
#
# 쿠팡에서 산 게 키보드인지 생필품인지에 따라 결론이 갈린다. 가맹점은 확실한데
# 품목을 모르는 경우라, 카테고리 단위로는 규칙을 세울 수 없다.
# 평가 골든셋 RC-002 가 요구하는 처리가 정확히 이것이다 — "되묻기로 보내고 보류".
