# ⚠️ group_by 가 transaction 이다. 같은 쿠팡이라도 건마다 산 게 다르므로
#    가맹점 단위로 묶으면 한 번의 답이 엉뚱한 건까지 확정해 버린다.
#    scope_key 가 "transaction:<id>" 라서 merchant 스코프의 '용도' fact 와도 겹치지 않는다.
#
# ⚠️ RC-002 가 말하는 실패 모습은 "품목 없이 §27 로 온라인쇼핑 전체에 규칙을 세우는 것"이다.
#    여기서 §27①은 카테고리 전체의 근거가 아니라 '업무용'이라고 답한 건에만 걸리는
#    선택지 근거다. 답하기 전에는 verdict 가 확인필요로 남는다.
