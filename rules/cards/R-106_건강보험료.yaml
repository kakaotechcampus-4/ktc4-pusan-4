# G2 · 지역가입자 건강보험료 — 소득세법시행령 §55①11의3
#
# ⚠️ 국민연금을 여기 넣지 말 것. 근거 조문은 「국민건강보험법」과
#    「노인장기요양보험법」만 규정한다. 국민연금 보험료는 필요경비가 아니라
#    종합소득공제(연금보험료공제) 대상이라, 키워드에 '국민연금'을 넣으면
#    공제 항목을 경비로 판정하는 오탐이 나간다.
#
# ⚠️ 키워드에 맨 '건강보험'·'장기요양'을 쓰지 말 것. keyword 는 merchant_raw 부분일치라
#    "메리츠화재 건강보험료"·"삼성생명 장기요양보험"이 그대로 걸린다. 민간 보험료는
#    근거 조문(시행령 §55①11의3, 국민건강보험법·노인장기요양보험법만 규정)이 닿지 않아
#    조문은 실재하는데 결론만 틀린 판정이 나간다. priority 510 이라 다른 카드가
#    바로잡아 주지도 못한다. 공단 결제로 특정되는 문자열만 남긴다.
#    공단 건을 일부 놓치더라도 G2 미매칭 -> 확인필요로 안전하게 떨어진다.
#
# category 를 걸지 않는다. 건강보험료 납부는 특정 가맹점 카테고리로 분류되지
# 않고 상호 원문에 드러난다. keyword 만 쓰므로 specificity 100 이라
# 같은 priority 의 카테고리 카드(80)를 이긴다 — 의도한 동작이다.
#
# priority 510: R-100·R-107(category+industry+금액 = specificity 100)과 점수가 같아져
#   priority 500 에 두면 로더의 차단 카드 충돌 검사에 걸린다.
