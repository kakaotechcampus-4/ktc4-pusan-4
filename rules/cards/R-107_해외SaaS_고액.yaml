# G2 · 해외SaaS 10만원 초과 — 연간 결제(선급비용) 가능성 (확인필요 + 되묻기)
#
# 카드 승인내역은 "얼마를 어떻게 나눠 냈는지"만 알고 "그 돈으로 몇 달을 쓰는지"는 모른다.
# JetBrains 연간 이용권 24만원을 전액 당해 경비로 판정하면 §33①14 선급비용을 어겨
# 금액을 과대계상한다(평가셋 E-043). 그래서 고액 결제는 확정하지 않고 기간을 되묻는다.
#
# 10만원 기준은 임시다(R-100 주석 참고). 월 청구액이 10만원을 넘는 AWS 도 여기로 오는데,
# 이건 CONTEXT 가 받아들이기로 한 과잉 질문이다. 선급비용 G4 카드가 생기면 이 카드는 없앤다.
#
# citations 는 §27① 하나만 둔다. R-100(같은 카테고리 10만원 이하)이 이미 같은 근거로
# 가능을 주고 있어 새로운 주장이 아니고, 이 카드의 쟁점은 통상성이 아니라 기간뿐이다.
# §33①14(선급비용)는 붙이지 않는다 — 연간 결제로 확인되기 전까지는 판정하지 않은
# 결론의 근거가 되기 때문이다(원칙 2).
#
# ⚠️ group_by 가 transaction 이다. 같은 AWS 라도 월 청구와 연간 선결제가 섞이므로
#    가맹점으로 묶으면 "월 단위"라고 한 답이 뒤이은 24만원 연간 결제까지 자동으로
#    가능 처리해 버린다. 그게 이 카드가 막으려던 §33①14 과대계상(E-043)이다.
#
# "연간 일시불" 선택지에 verdict 를 두지 않는다. 기간배분은 판정이 아니라 금액 산정
# 단계(G4)의 일이라, 여기서는 확인필요를 유지한 채 세무사에게 넘긴다.
