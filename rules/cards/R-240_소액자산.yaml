# G4 · 결제 100만원 이하 — 묻지 않고 즉시 경비 (소득세법 시행령 §67④, 2026.10.1 시행)
#
# §67④ 는 "거래단위별로 100만원 이하" 감가상각자산을 사업에 쓴 해의 필요경비에 산입한다.
# 거래단위는 독립적으로 사업에 직접 쓸 수 있는 자산 하나다(§67⑤). 결제 한 건에 여러 물건이
# 섞일 수 있지만, 결제가 100만원 이하면 그 안의 어느 물건도 100만원을 넘을 수 없으므로 묻지 않는다.
# (세무사 자문 2026.09: 100만원 이하는 즉시 경비, 기준은 결제 건이 아니라 자산 1개당)
#
# 예전 v2 는 "전액 비용 처리할까요" 를 되물어 G2 가 가능으로 확정한 거래를 확인필요로 되돌렸다(E-041).
# 이제 질문 없이 `즉시상각` 속성만 남긴다. 금액 계산(A6a)이 이 속성을 읽는다.
#
# 전자기기는 §67⑦ 품목이라 R-243·R-244 가 따로 받는다.
# 생활용품은 match 에서 뺀다. 다이소류 소모품은 감가상각자산이 아니어서 §67④ 가 적용될 자리가 아니다
# (평가셋 E-053). 100만원을 넘는 생활용품은 R-241 이 받는다.
#
# 한계(카드로 가르지 못하는 것)
#   - §67④ 단서: 고유업무 성질상 대량 보유 자산, 사업 개시·확장을 위해 취득한 자산은 100만원 이하여도
#     즉시 경비가 아니다. 결제 내역으로는 알 수 없어 반영하지 않았다.
#   - 내용연수는 기준 5년(4~6년 범위에서 신고로 선택, 시행령 §63). 신고 여부를 알 수 없어 5년으로 둔다.
#   - 상각방법은 무신고 시 건축물 외 유형자산 정률법(시행령 §64①2). 신고했다면 정액법일 수 있다.
