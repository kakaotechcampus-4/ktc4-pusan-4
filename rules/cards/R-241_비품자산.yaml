# G4 · 결제 100만원 초과 — 하나에 100만원 넘는 물건이 있는지 묻는다 (소득세법 시행령 §67④⑤, 2026.10.1 시행)
#
# §67④ 의 100만원은 결제 건이 아니라 거래단위(§67⑤: 독립적으로 사업에 쓸 수 있는 자산 하나) 기준이다.
# 결제가 100만원을 넘어도 물건 하나하나가 100만원 이하면 즉시 경비다. 그래서 묻는다.
#   PC·휴대폰·가구 같은 물건 -> §67⑦ 품목. `즉시상각_가능` + 그해 계상 안내(R-243·R-244 와 같다)
#   그 외 100만원 넘는 물건   -> 감가상각자산. 정률법·5년
#   없음                     -> 즉시 경비
#   답 없음                  -> 확인필요 (엔진이 `자산`·`즉시상각` 을 금액을 바꾸는 속성으로 보고 강등한다)
# (세무사 자문 2026.09: 자산 1개당 100만원, 무신고 시 정률법, 기준내용연수 5년)
#
# 예전 v1 은 "1년 넘게 사용하나요?" 를 묻고 정액법을 붙였다. 상각방법은 §64①2 무신고 기본값(정률법)으로 고쳤다.
# 전자기기는 §67⑦ 품목이라 R-244 가 따로 받는다.
#
# 사무용품·생활용품·온라인쇼핑에도 §67⑦ 품목(가구·비품·가정용 기구, 그 경로로 산 PC 등)이 섞인다.
# 카테고리로는 가를 수 없어 사용자에게 고르게 한다(평가셋 E-045: 맥북이 사무용품으로 들어온다).
# ⚠️ 한 결제에 ⑦ 품목과 그 밖의 100만원 초과 물건이 함께 있으면 한 답으로 나타낼 수 없다. 드문 경우라 두었다.
#
# 한계(카드로 가르지 못하는 것)
#   - §67④ 단서: 고유업무 성질상 대량 보유 자산, 사업 개시·확장을 위해 취득한 자산은 100만원 이하여도
#     즉시 경비가 아니다. 결제 내역으로는 알 수 없어 반영하지 않았다.
#   - 내용연수는 기준 5년(4~6년 범위에서 신고로 선택, 시행령 §63). 신고 여부를 알 수 없어 5년으로 둔다.
#   - 상각방법은 무신고 시 건축물 외 유형자산 정률법(시행령 §64①2). 신고했다면 정액법일 수 있다.
