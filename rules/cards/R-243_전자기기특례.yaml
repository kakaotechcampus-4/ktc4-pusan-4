# G4 · 전자기기 100만원 이하 — §67⑦ 품목, 즉시 경비 (소득세법 시행령 §67⑦2·4, 2026.10.1 시행)
#
# §67⑦ 은 전화기(휴대폰)·개인용 컴퓨터(주변기기 포함)(4호), 전기기구·가구·가정용 기구 및 비품·공구·
# 시계·측정기기·간판(2호)을 금액과 무관하게 "사업에 사용한 해에 필요경비로 계상한 것에 한정하여" 산입한다.
# 카테고리 전자기기는 PC·휴대폰·주변기기·전기기구라 이 품목으로 본다.
#
# 100만원 이하는 묻지 않는다(§67④ 로도 즉시 경비다). `즉시상각_가능` 과 계상 안내를 남긴다.
# 100만원 초과는 R-244 가 자산 처리 선택지를 묻는다.
#
# 한계(카드로 가르지 못하는 것)
#   - §67④ 단서: 고유업무 성질상 대량 보유 자산, 사업 개시·확장을 위해 취득한 자산은 100만원 이하여도
#     즉시 경비가 아니다. 결제 내역으로는 알 수 없어 반영하지 않았다.
#   - 내용연수는 기준 5년(4~6년 범위에서 신고로 선택, 시행령 §63). 신고 여부를 알 수 없어 5년으로 둔다.
#   - 상각방법은 무신고 시 건축물 외 유형자산 정률법(시행령 §64①2). 신고했다면 정액법일 수 있다.
