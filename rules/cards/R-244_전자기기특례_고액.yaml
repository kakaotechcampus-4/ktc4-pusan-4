# G4 · 전자기기 100만원 초과 — §67⑦ 품목, 즉시 경비와 자산 처리 중 고른다 (소득세법 시행령 §67⑦2·4, 2026.10.1 시행)
#
# §67⑦ 품목은 금액과 무관하게 그해 필요경비로 계상하면 즉시 경비다. 계상하지 않으면 감가상각자산이다.
# 둘 중 무엇을 할지는 사용자 선택이라 묻는다. 답 전까지는 확인필요다(R-241 과 같은 이유).
# 카드 속성 `즉시상각_가능` 은 답과 무관하게 남는다.
# (세무사 자문 2026.09: 100만원 초과는 기준내용연수 5년, 무신고 시 정률법)
#
# 한계(카드로 가르지 못하는 것)
#   - §67④ 단서: 고유업무 성질상 대량 보유 자산, 사업 개시·확장을 위해 취득한 자산은 100만원 이하여도
#     즉시 경비가 아니다. 결제 내역으로는 알 수 없어 반영하지 않았다.
#   - 내용연수는 기준 5년(4~6년 범위에서 신고로 선택, 시행령 §63). 신고 여부를 알 수 없어 5년으로 둔다.
#   - 상각방법은 무신고 시 건축물 외 유형자산 정률법(시행령 §64①2). 신고했다면 정액법일 수 있다.
