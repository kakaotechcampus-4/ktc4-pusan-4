# G2 · 경조사(화환·경조금) — 상대방에 따라 §35 접대비 vs §33①5 가사
#
# 개인 지인이면 §33①5 가사경비다. 거래처 경조금이면 §35① 기업업무추진비라 가능이다(시행령 §83②1 로
# 20만원까지 증빙 특례, 한도는 접대비 버킷으로 연간 집계). §35 가 개인 판정에 새지 않도록
# §35① 은 업무미팅 선택지에만 싣는다 — R-300·R-301(#56)과 같은 방식(#65).
# 상대방을 결제내역으로 알 수 없어(E-013·E-014) 되묻는다.
#
