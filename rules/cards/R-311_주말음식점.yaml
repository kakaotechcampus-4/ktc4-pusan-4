# G2 · 주말·공휴일 음식점 — 개인 식사로 추정해 불가, 소명하면 평일과 같게 (R-312~R-314 의 기준 카드)
#
# 세무사 미팅에서 "주말 음식점은 주로 뺀다"고 했고, 질의응답 보고서(2026-09) Q2 는 미팅
# 상대방·목적·기록이 없으면 개인 식사비로 추정하고 주말·공휴일은 더 엄격히 소명받는다고 한다.
# 실무 자료(세무법인 혜움 2025-03, 이데일리 2025-11 세무사 인터뷰)도 "주말은 입증이 필요하고,
# 업무 관련이면 요일은 상관없다"로 같다. 회의 결정(2026-09)도 "기본 불가, 소명하면 가능"이다.
# 그래서 기본 불가 + 소명 질문이다. holiday: true 는 토·일과, 엔진에 넘긴 평일 공휴일에 매칭한다.
#
# 요일로 경비를 막는 조문은 없다(소득세법·시행령·시행규칙 원문, 시행 2026-07-01 에서 휴일·주말이
# 나오는 조문은 §12·시행령 §17 근로자 급여 비과세뿐). 불가의 근거는 §33①5 가사경비이고,
# 요일은 그 추정의 근거일 뿐이다. 그래서 로더가 요일 카드의 불가에 '풀 수 있는 질문'을 요구하고,
# 엔진은 소명 대기인 불가의 질문을 지우지 않는다.
#
# 업무미팅 답은 평일(R-301)과 같은 결과를 낸다: 가능 §35① + 접대비 버킷. §35① 은 선택지에만
# 싣는다(개인 불가에 붙으면 접대비 오적용, E-027). 소명한 주말이 평일보다 유리하거나 불리하지 않다.
#
# priority 505: 주말에 R-301(500)을 이긴다. 로더 충돌 검사가 요일을 보지 않으므로 같은
# priority 에 두면 차단 카드 충돌로 거부된다. fact_type·값은 R-301·평가셋과 같은 어휘다.
