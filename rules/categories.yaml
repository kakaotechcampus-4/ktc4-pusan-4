# 카테고리 허용 어휘의 단일 원본.
# tools/validate_rules.py 와 backend RuleCardLoader 가 이 목록을 읽어
# 룰카드의 category / exclude_category 값을 검증한다.
# enum 밖의 값은 FAIL 이다. 새 카테고리가 필요하면 PM 에게 요청할 것.
# 기준은 업종 세분화가 아니라 G2(사업관련성)에서 다르게 처리되는지다.
# 순서를 바꾸면 docs/categories.md 도 함께 바뀌니 주의(문서는 이 순서로 생성된다).
categories:
  - 카페
  - 음식점
  - 편의점
  - 온라인쇼핑
  - 음식배달
  - 해외SaaS
  - 국내SW
  - 통신
  - 수도광열
  - 여비교통
  - 차량
  - 도서
  - 교육
  - 광고
  - 사무용품
  - 의료
  - 금융
  - 지자체_과태료
  - 경찰청_범칙금
  - 조세
  - PG_미상
  - 기타
  # T3 에서 추가 (PM 승인). 업종 세분화가 아니라 G2(사업관련성)에서
  # 다르게 처리되는지가 분리 기준이다.
  #   게임·여가·미용  -> 사업 무관 후보
  #   구독서비스      -> 업무용 가능
  #   생활용품        -> 사업/개인 혼재
  # 노래방·PC방·볼링은 세무 판정이 같으므로 '여가' 하나로 묶는다. 업종별로 쪼개지 않는다.
  - 게임
  - 구독서비스
  - 여가
  - 미용
  - 생활용품
