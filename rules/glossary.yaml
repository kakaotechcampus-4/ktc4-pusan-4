# 용어집. 화면의 낱말 뜻 보기가 읽는다(FE 빌드가 JSON 으로 바꿔 번들에 넣는다).
#
# 문장은 비서 도움말(ai/assistant/kb.yaml), 화면 문구, rules/cards 의 주석에서 옮겼다.
# 세무 내용이라 세무사 확인 전 초안이다. 확인하면 review 를 고친다.
#
# term     화면에 보이는 이름
# aliases  같은 뜻으로 고를 법한 다른 표기. 고른 글이 이 가운데 하나와 같으면 뜻을 보인다
# body     풀이. 합니다체, 한두 문장
# statute  근거 조문 id(rules/cards 의 citations 와 같은 꼴). 없으면 뺀다
review: { by: 미검수, date: 2026-11-10 }
terms:
  - term: 확인 필요
    aliases: [확인필요]
    body: 실패가 아닙니다. 질문에 답하면 판정이 정해지는 거래이거나, 규칙으로 다루지 않아 세무사가 봐야 하는 거래입니다.
  - term: 답변 대기
    aliases: [소명 대기, 소명대기, 답변대기]
    body: 불가로 추정했지만 사정을 밝히면 풀리는 거래입니다. 주말이나 공휴일 식대처럼 건마다 사정이 달라 하나씩 답해야 합니다.
  - term: 가능
    aliases: [경비 가능]
    body: 근거 조문이 붙은 규칙으로 필요경비에 넣을 수 있다고 본 거래입니다.
  - term: 불가
    aliases: []
    body: 근거 조문이 붙은 규칙으로 필요경비에 넣을 수 없다고 본 거래입니다.
  - term: 필요경비
    aliases: [경비]
    body: 사업소득을 계산할 때 수입에서 빼는 비용입니다. 사업에 직접 필요하고 일반적으로 인정되는 비용이어야 합니다.
    statute: 소득세법-27-1
  - term: 통상성
    aliases: [통상적]
    body: 그 사업에서 흔히 쓰는 비용인지를 봅니다. 판정의 두 번째 관문이고 규칙 카드로 가립니다.
    statute: 소득세법-27-1
  - term: 필요경비 불산입
    aliases: [불산입]
    body: 법이 경비로 넣지 말라고 정해 둔 것입니다. 벌금, 과태료, 가산금, 조세 등이 해당하고 판정의 첫 관문에서 바로 불가가 됩니다.
    statute: 소득세법-33-1-1
  - term: 가사경비
    aliases: [가사 관련 경비, 가사관련비, 가사 경비]
    body: 집안 살림이나 개인 생활에 쓴 비용입니다. 필요경비에 넣지 않습니다.
    statute: 소득세법-33-1-5
  - term: 안분
    aliases: [안분 비율]
    body: 업무와 개인 생활에 함께 쓴 비용을 업무에 쓴 몫만큼 나눠 경비에 넣는 것입니다. 이 서비스는 비율을 제안하지 않습니다.
  - term: 즉시상각
    aliases: [즉시 상각, 즉시 경비]
    body: 100만 원 이하로 산 자산은 여러 해에 나누지 않고 사업에 쓴 해에 바로 경비로 넣습니다.
    statute: 소득세법시행령-67-4
  - term: 감가상각
    aliases: [자산화, 상각]
    body: 오래 쓰는 물건은 산 해에 전부 넣지 않고 쓰는 기간에 나눠 경비로 넣습니다. 판정의 네 번째 관문이 이것을 봅니다.
  - term: 적격증빙
    aliases: [증빙]
    body: 신용카드 매출전표, 현금영수증, 세금계산서, 계산서처럼 법이 인정하는 증빙입니다. 카드 결제는 매출전표가 증빙이 됩니다.
    statute: 소득세법시행령-208의2-1-1
  - term: 기업업무추진비
    aliases: [접대비]
    body: 거래처를 대접하는 데 쓴 비용입니다. 한 해에 경비로 넣을 수 있는 한도가 있어, 넘은 만큼은 빠집니다.
    statute: 소득세법-35-1
  - term: 한도
    aliases: [연간 한도]
    body: 기업업무추진비는 한 해 동안의 합계를 한도와 견줍니다. 이 서비스의 한도는 사업자 문진의 직전연도 수입금액으로 계산한 잠정치입니다.
    statute: 소득세법-35-1
  - term: 귀속연도
    aliases: [귀속]
    body: 그 비용이 속하는 해입니다. 이 서비스는 2026년 귀속만 다룹니다.
  - term: 승인내역
    aliases: [이용내역, 승인 내역]
    body: 카드사 홈페이지나 앱에서 조회한 결제 승인 목록입니다. 청구내역은 할부가 회차별로 쪼개져 있어 판정에 쓰지 않습니다.
  - term: 취소상계
    aliases: [취소 상계]
    body: 승인한 뒤 취소한 결제는 원래 결제와 함께 지워 판정에서 뺍니다.
  - term: 근거
    aliases: [근거 조문]
    body: 법률, 시행령, 시행규칙 조문입니다. 가능이나 불가로 정한 판정에는 늘 붙습니다.
  - term: 참고 해석기준
    aliases: [기본통칙, 예규]
    body: 국세청의 해석기준입니다. 법적 구속력은 없어 근거와 나눠 보여 줍니다.
  - term: 세무대리인
    aliases: [세무사]
    body: 비율이나 세액처럼 이 서비스가 정하지 않는 것을 판단할 사람입니다. 요약 화면에서 넘길 문장을 정리합니다.
  - term: 관문
    aliases: [게이트]
    body: 판정은 관문 여섯 개를 차례로 지납니다. 법이 막는 지출, 통상성, 안분, 자산, 증빙, 한도 순이고, 앞의 두 관문에서 불가가 정해지면 뒤 관문은 보지 않습니다.
