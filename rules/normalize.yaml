version: 1
# 인코딩 처리는 이 파일이 하지 않는다. 파서가 파일을 읽을 때
# utf-8 / errors=replace 로 처리한다 (tools/parsers/*.py).

# ─────────────────────────────────────────────────────────────
# 키 전략 — norm_key 는 항상 문자열(string_norm)이다. (#22 A안, T4 1단계)
#
#   사업자번호는 키로 쓰지 않는다. 프랜차이즈는 점포마다 사업자번호가 달라서
#   사업자번호를 키로 쓰면 같은 브랜드가 점포 수만큼 갈린다(실측: 제품경로 GS25
#   23건이 키 2개). 사업자번호는 버리지 않고 결과의 biz_no 필드로 남긴다 —
#   점포 테이블(T4 2단계)의 키가 된다.
#
#   트랙은 키가 아니라 라벨이다. 둘 다 키는 string_norm 이다.
#   - overseas: 사업자번호 없음 + 영문 위주. 지점명·법인 표기 규칙이 의미가 없다
#   - string:   그 외
#
# ★ 이 블록을 읽는 코드는 아직 없다. normalize() 가 같은 로직을 하드코딩한다.
#   Python(tools/normalize.py)·Java(T1Normalizer) 를 같이 고쳐야 한다.
# ─────────────────────────────────────────────────────────────
key_strategy:
  - { track: 1, id: overseas, when: is_overseas, key: string_norm }
  - { track: 2, id: string,   when: default,     key: string_norm }

detect:
  # EUC-KR 20바이트에 '정확히' 닿으면 카드사가 잘라낸 것으로 본다.
  # 카드사가 20에서 자르므로 그보다 긴 문자열은 오지 않는다.
  # '이상'으로 두면 20을 넘는 정상 입력까지 절단으로 오판한다.
  # 실측: 12개 상호가 정확히 20바이트.
  truncation:
    encoding: euc-kr
    max_bytes: 20
    # 판정은 '>= max_bytes' 가 아니라 '== max_bytes' 다 (코드에 하드코딩).
    # 카드사가 20에서 자르므로 그보다 긴 문자열은 오지 않는다.
    # 닫히지 않은 괄호는 바이트와 무관하게 절단 확정이다(T5 1층 8행).
    unclosed_bracket: true
    # 19바이트는 '의심' 이다. 마지막 2바이트 글자가 깨져 버려졌을 수 있지만
    # 진짜 19자 상호도 섞여 있어 바이트만으로는 가를 수 없다(실측 4건 중 2건).
    # resolve_brand 가 이름이 사전 브랜드 중간에서 끝날 때(브랜드 앞부분만 일치)만
    # 절단으로 확정한다. 브랜드 전체가 이름에 들어 있으면 의심으로 둔다.
    # '>= 19' 로 넓히지 않는다 — 넓히면 19바이트 정상 상호의 지점 제거가 멈춘다.
    suspect_bytes: 19
  # 해외 결제 판정: 영문 위주 + 사업자번호 없음.
  # 사업자번호가 있으면 국내 가맹점이므로 무조건 트랙 1로 간다.
  overseas:
    require_no_bizno: true
    ascii_letter_ratio_min: 0.5

steps:
  - id: trim_normalize_space
  - id: fullwidth_to_halfwidth

  # 절단 감지는 원문 길이로 판단해야 하므로 문자를 지우기 전에 둔다.
  - id: detect_truncation

  # ★ strip_corp 가 strip_special 보다 먼저다.
  #   순서가 반대면 "(주)" 의 괄호가 먼저 사라져 패턴이 빗나가고
  #   "주우아한형제들" 같은 키가 만들어진다.
  - id: strip_corp
    patterns:
      - "\\(주\\)"
      - "\\(유\\)"
      # ㈜ 는 도달 불가능한 줄이다 — fullwidth_to_halfwidth(NFKC)가 먼저
      # (주) 로 분해한다. 지우지 않고 남겨둔다 (engine README_T1.md 참고).
      - "㈜"
      - "주식회사"
      - "유한회사"
      - "코리아(?=\\s|$)"
      - "KOREA(?=\\s|$)"

  # 구분자 분해. 카드 전표에 실제로 오는 구조:
  #     서비스명_PG명-법인명        토스페이_요기요-(주) 비바리퍼블리카
  #     서비스명_구분-법인명        삼성닷컴_청구-삼성전자(주)
  #
  # 어느 토큰이 PG이고 어느 쪽이 서비스명인지는 문자열만으로 결정되지 않는다.
  #   ANTHROPIC*CLA          -> 앞이 서비스명
  #   PYU*Amazon Seller Serv -> 앞이 PG (PayU)
  # 그래서 여기서는 자르기만 하고 하나도 버리지 않는다. 판정은 T2(pg_blocklist)가 한다.
  - id: split_delimiters
    join: "|"
    # 항상 자른다. 상호명 안에 이 문자가 들어가는 경우는 확인되지 않았다.
    always: ["*", "_"]
    # 조건부로 자른다. '-' 는 상호명 안에도 쓰인다:
    #   "이랜드리테일 부산대점-푸드코트"  <- 자르면 안 된다
    # 전체 토큰이 3개 이상이거나 PG 힌트가 보일 때만 자르고,
    # 아니면 원문을 유지한다.
    conditional: ["-"]
    conditional_min_tokens: 3
    # 반복 토큰은 접는다. "KIS정보통신-KIS정보통신" -> "KIS정보통신"
    collapse_repeats: true
    # 이 패턴에 걸리면 자르지 않는다. 파서가 만든 라벨은 가맹점명이 아니다.
    preserve:
      - "^의료_마스킹"
    # PG 힌트. 정식 목록은 T2 의 rules/pg_blocklist.yaml 이고,
    # 그 파일이 생기면 엔진이 그쪽을 우선해서 읽는다. 여기 것은 최소 폴백이다.
    pg_hints:
      - "정보통신"
      - "페이먼츠|PAYMENTS"
      - "비바리퍼블리카|토스페이"
      - "카카오페이|네이버페이"
      - "이니시스|INICIS"
      - "KCP|다날|DANAL"
      - "나이스페이|NICEPAY"
      - "코페이|섹타나인"
      - "KIS"
      - "PAYU|PYU"

  - id: strip_special
    chars: "[.*#/&,'\"()\\[\\]_~\\\\]"
  - id: upper_ascii

  # 브랜드 사전(T4 1겹). 상호 앞부분이 사전 표기와 맞으면 브랜드 키로 바꾸고
  # 뒤를 지점으로 뗀다. 맞으면 아래 strip_branch 는 건너뛴다.
  #   - 뒤가 지점 모양(branch)이 아니면 떼지 않는다 — 하위 업태는 별도 브랜드다
  #   - 절단(20B·괄호 미닫힘)이면 뒤가 무엇이든 브랜드로 복원한다
  #   - 19바이트 의심은 이름이 사전 브랜드 중간에서 끝날 때만 절단 확정 + 복원한다.
  #     브랜드 전체가 들어 있으면 의심으로 두고 일반 매칭(지점 모양이면 지점)으로 간다
  #   - 사전에 없으면 원문 그대로 다음 단계로 간다
  # 영문으로 끝나는 표기 뒤에 영문이 이어지면 다른 단어로 본다('CU' vs 'CUTE').
  # 사전 원본은 rules/brands.yaml 이다. 로더가 읽어 이 단계의 brands 로 넣는다.
  - id: resolve_brand
    dict: brands.yaml
    branch:
      - "^[가-힣A-Z0-9]+점$"
      - "^[0-9]{3,}$"

  # 절단된 문자열에는 적용하지 않는다. 뒤가 이미 잘려나갔으므로
  # 지점명 제거 규칙이 엉뚱한 글자를 먹는다.
  - id: strip_branch
    skip_if_truncated: true
    min_keep: 2
    patterns:
      # 1) 공백으로 분리된 지점 토큰      "GS25 역삼점" -> "GS25"
      - "\\s+[가-힣A-Z0-9]+점$"
      # 2) 영문·숫자 뒤에 붙은 지점 토큰   "GS25부산의대학사점" -> "GS25"
      - "(?<=[A-Z0-9])[가-힣]+점$"
      # 3) 한글만으로 된 지점 토큰. min_keep 에 걸리면 적용하지 않는다.
      #    "롯데리아양산부산대점" 은 전부 한글이라 여기서 통째로 사라지므로
      #    보호되고, 아래 4)만 적용된다.
      - "[가-힣]{2,}점$"
      # 4) 마지막 안전판 — 표기어만 제거
      - "(지점|매장|영업소)$"
      # 5) 점포번호
      - "\\d{3,}$"

  - id: protect_exceptions
  - id: drop_space

# 이 토큰이 입력에 있었으면 결과에도 남아 있어야 한다.
# 사라지면 축약 직전 값으로 되돌린다.
exceptions:
  - 쿠팡이츠        # 쿠팡(온라인쇼핑)과 다른 가맹점이다
  - 이마트24        # 이마트(대형마트)와 다른 가맹점이다
  - GS25            # 지에스더프레시·GS칼텍스와 구분
  - 이마트에브리데이
  - 세븐일레븐
  - 배민스토어      # 배달의민족과 정산 주체가 다르다

# ─────────────────────────────────────────────────────────────
# test_cases — 합성 케이스. 이 규칙 파일이 만드는 **모든 경로**를 덮는 것이 목적이다.
#
# 파이썬(tools/normalize.py --selftest)과 자바(T1Cli --selftest)가 이 파일을
# 같이 읽으므로, 여기에 케이스를 넣으면 양쪽이 함께 검증된다.
#
# ★ 새 규칙을 추가하면 그 규칙이 만드는 경로를 여기에 반드시 넣는다.
#   엔진 폴더의 '실측 상호 43건 대조' 는 실데이터에서 뽑은 고정 목록이라,
#   실데이터에 아직 없는 입력은 대조에 들어갈 수가 없다. 새 규칙이 만드는
#   경로를 구조적으로 못 잡는다. (engine/.../README_T1.md 참고)
# ─────────────────────────────────────────────────────────────
test_cases:
  - { in: "스타벅스코리아 강남대로점", out: "스타벅스" }
  - { in: "GS25 역삼점", out: "GS25" }
  - { in: "GS25부산의대학사점", out: "GS25" }
  - { in: "(주)우아한형제들", out: "우아한형제들" }
  - { in: "이마트24 성수점", out: "이마트24" }
  # 브랜드 사전이 표기를 하나로 모은다(지에스25 -> GS25)
  - { in: "지에스25 가나다점", out: "GS25" }
  - { in: "코레일유통주식회사(", out: "코레일유통" }
  # 절단된 문자열은 지점명 제거를 하지 않는다
  - { in: "하이오커피 해운대 우", out: "하이오커피해운대우" }
  # 별표 양쪽 토큰 보존
  - { in: "ANTHROPIC* CLA", out: "ANTHROPIC|CLA" }
  - { in: "PYU*Amazon Seller Serv", out: "PYU|AMAZONSELLERSERV" }
  # 언더바·하이픈 구분자 (서비스명_PG명-법인명)
  - { in: "토스페이_요기요-(주) 비바리퍼블리카", out: "토스페이|요기요|비바리퍼블리카" }
  - { in: "다날_대표-그렙", out: "다날|대표|그렙" }
  - { in: "삼성닷컴_청구-삼성전자(주)", out: "삼성닷컴|청구|삼성전자" }
  - { in: "섹타나인_코페이_비인증_일반-주식회사 코페이", out: "섹타나인|코페이|비인증|일반" }
  # 반복 토큰은 접는다
  - { in: "KIS정보통신-KIS정보통신", out: "KIS정보통신" }
  - { in: "배민클럽_우아한형제들-배민클럽_우아한형제들", out: "배민클럽|우아한형제들" }
  - { in: "(주)우아한형제들-주식회사 우아한형제들", out: "우아한형제들" }
  # '-' 오분해 방지 — 2토큰이고 PG 힌트가 없으면 원문 유지
  - { in: "이랜드리테일 부산대점-푸드코트", out: "이랜드리테일부산대점-푸드코트" }
  - { in: "교통-버스1건", out: "교통-버스1건" }

  # ── 예외 토큰 (protect_exceptions) ────────────────────────
  # 쿠팡(온라인쇼핑)과 갈라야 하는 핵심 예외인데 테스트가 없었다.
  - { in: "쿠팡이츠", out: "쿠팡이츠" }
  - { in: "쿠팡이츠 강남점", out: "쿠팡이츠" }
  - { in: "세븐일레븐 역삼점", out: "세븐일레븐" }
  - { in: "이마트에브리데이 강남점", out: "이마트에브리데이" }
  - { in: "배민스토어 성수점", out: "배민스토어" }
  # 점포번호 제거가 예외 토큰을 먹으면 축약 직전 값으로 되돌린다.
  # 이마트24 가 브랜드 사전에 들어가 '이마트241234' 는 이제 사전이 먼저 받는다
  # (점포번호를 지점으로 떼서 이마트24). 복원 경로는 사전에 안 걸리는 입력으로 지킨다.
  - { in: "이마트241234", out: "이마트24" }
  - { in: "가나이마트241234", out: "가나이마트241234" }

  # ── strip_corp 미검증 패턴 ────────────────────────────────
  - { in: "(유)한국통신", out: "한국통신" }
  - { in: "유한회사 그렙", out: "그렙" }
  - { in: "AWS KOREA", out: "AWS" }
  # ㈜ 패턴 자체는 도달 불가능하다 — NFKC 가 먼저 (주) 로 분해한다.
  # 그래도 입력으로는 들어오므로 결과를 고정해 둔다.
  - { in: "㈜우아한형제들", out: "우아한형제들" }

  # ── 전각·공백 정리 (값을 바꾸는 입력이 없었다) ────────────
  - { in: "ＧＳ２５ 역삼점", out: "GS25" }
  - { in: "스타벅스   강남대로점", out: "스타벅스" }

  # ── strip_branch 미검증 패턴 ──────────────────────────────
  # 전부 한글이라 [가-힣]{2,}점$ 이 통째로 먹는다 -> min_keep 가드가 막고
  # (지점|매장|영업소)$ 로 넘어간다
  - { in: "형지엘리트부산지점", out: "형지엘리트부산" }
  - { in: "이마트24매장", out: "이마트24" }
  - { in: "자판기1234", out: "자판기" }

  # ── split_delimiters 미검증 경로 ──────────────────────────
  # 파서가 만든 마스킹 라벨은 자르지 않는다
  - { in: "의료_마스킹_01", out: "의료마스킹01" }
  # 토큰이 2개뿐이어도 PG 힌트가 걸리면 자른다
  - { in: "나이스정보통신-그렙", out: "나이스정보통신|그렙" }

  # ── resolve_brand (T4 1겹, rules/brands.yaml) ──────────────
  # 한글 브랜드 + 한글 지점. 정규식으로는 경계를 못 찾아 원문이 남던 경로(#35)
  - { in: "씨유가나다점", out: "CU" }
  - { in: "세븐일레븐가나다점", out: "세븐일레븐" }
  - { in: "씨유(CU)가나다점", out: "CU" }
  # 표기가 달라도 같은 브랜드 키로 모인다
  - { in: "메가커피 가나다점", out: "메가MGC커피" }
  - { in: "BHC치킨 가나다점", out: "BHC" }
  # 영문 표기 뒤에 영문이 이어지면 다른 단어다 — CU 가 아니다
  - { in: "CUTE가나다점", out: "CUTE" }
