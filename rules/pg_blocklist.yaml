version: 1

# ─────────────────────────────────────────────────────────────
# 결제대행사(PG) 차단 목록.
#
# PG 이름은 가맹점이 아니다. 사전에 한 번 들어가면 그 PG 를 거친
# 모든 결제가 조용히 같은 카테고리로 분류된다. 그래서 사전 조회
# **앞단**에서 차단하고 되묻기로 보낸다.
#
# 판별식
#   뒤에 뭐가 붙어도 카테고리가 안 변하면 -> 사전 매핑 (T4)
#   변하면                              -> PG 블록 (여기)
#
# 실증 근거 (전부 우리 데이터)
#   구글플레이      -> Onedrive / Gemini / GPT 세 상품으로 갈림 (KB memo 컬럼)
#   나이스정보통신   -> 실제는 ChatGPT (네이버페이 화면에서만 확인 가능)
#   토스페이_요기요-비바리퍼블리카 -> PG 사이에 서비스명이 끼어 있다
#
# 여기 넣지 않은 것 (PG 가 아니다. T4 시드 사전으로 간다)
#   배민클럽_우아한형제들  <- 배달의민족 구독. 우아한형제들 자체 상품
#   삼성닷컴_청구-삼성전자 <- 삼성 자체 청구
#   구글클라우드코리아     <- GCP. 실제 서비스명
#   전부 "뒤에 뭐가 붙어도 카테고리 불변" 이다. PG 로 차단하면 매달 반복되는
#   확정 지출이 매달 되묻기로 간다 — 되묻기를 줄이는 목표와 반대로 간다.
# ─────────────────────────────────────────────────────────────

on_match:
  category: PG_미상
  needs_review: true
  seed_insert: false        # 매칭돼도 사전에 등록하지 않는다

# T1 split_delimiters 로 분해된 토큰 중 아래에 걸린 것만 차단하고,
# 걸리지 않은 토큰은 matched_suffix 로 남긴다. 되묻기 화면의 힌트가 된다.
#   토스페이_요기요-비바리퍼블리카 -> PG: 토스페이, 비바리퍼블리카 / 힌트: 요기요
#   다날_대표-그렙                -> PG: 다날 / 힌트: 그렙
#   KIS정보통신-KIS정보통신        -> 전부 PG / 힌트 없음
keep_tokens: true

patterns:
  # ── 국내 PG ──────────────────────────────────────────────
  - { match: "KG이니시스|케이지이니시스|INICIS", note: "PG" }
  - { match: "NHN\\s*KCP|한국사이버결제", note: "PG" }
  - { match: "토스페이|토스페이먼츠|비바리퍼블리카|TOSSPAYMENTS", note: "PG. 실증: 토스페이_요기요-비바리퍼블리카" }
  - { match: "나이스페이|나이스정보통신|NICEPAY", note: "PG. 실증: 카드에는 나이스정보통신, 실제는 ChatGPT" }
  - { match: "KIS정보통신", note: "PG. 실증: 팀원 데이터 3건" }
  - { match: "섹타나인|코페이", note: "PG. 실증: 섹타나인_코페이_비인증_일반" }
  - { match: "다날|DANAL", note: "PG. 실증: 다날_대표-그렙" }
  - { match: "카카오페이|네이버페이", note: "[PM 확인] 뒤에 가맹점명이 붙는 경우가 있다. 아래 open_questions 참고" }

  # ── 앱스토어·플랫폼 결제 ─────────────────────────────────
  - { match: "구글플레이|구글페이먼트코리아|GOOGLE\\s*PAY(MENT)?", note: "앱스토어 결제. 실증: 한 상호에 Onedrive/Gemini/GPT 세 상품" }
  - { match: "APPLE|ITUNES|APP\\s*STORE", note: "앱스토어 결제" }

  # ── 해외 PG ──────────────────────────────────────────────
  - { match: "PAYPAL|페이팔", note: "해외 PG" }
  - { match: "PADDLE|STRIPE|스트라이프", note: "해외 PG. 뒤에 서비스명이 붙는 경우가 있다" }
  - { match: "PYU|PayU", note: "해외 PG. 실증: PYU*Amazon Seller Serv" }
  - { match: "KOMOJU", note: "해외 PG(일본). 실증: Steam 결제가 이 경로를 탄다" }
  - { match: "이니시스|엔에이치엔케이씨피", note: "PG 한글 표기" }

# PM 판단이 필요한 항목. 결론 나면 patterns 로 옮기거나 T4 로 넘긴다.
open_questions:
  - id: kakaopay_naverpay
    item: "카카오페이 / 네이버페이"
    question: "뒤에 가맹점명이 붙어 오는 비율이 얼마인가. 붙어 오면 그 토큰으로 분류할 수 있다"
    현재처리: "차단하고 남은 토큰을 matched_suffix 로 남긴다"
    실증: "카카오선물하기_카카오페이-주식회사카카오 -> 힌트로 카카오선물하기 확보"
  - id: steam_komoju
    item: "Steam (Korea)"
    question: "카드 전표에 KOMOJU 가 찍히는 경우가 있는지. 현재 문자열에는 안 나온다"
    현재처리: "차단되지 않는다. 해외 트랙으로 가서 T3 키워드룰이 받는다"
  - id: danal_generic
    item: "다날"
    question: "'다날' 은 짧아서 다른 상호에 들어갈 수 있다 (예: 가상의 '다날식당')"
    현재처리: "그대로 둔다. 현재 데이터에서 오탐 0건"
