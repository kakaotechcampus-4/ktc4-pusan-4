# PG 차단(T2) fixture — 실제 rules/pg_blocklist.yaml 로 판정한다.
#
# 파이썬(tools/pg_block.py --fixture)과 Java(PgBlocklistRulesTest)가 같은 파일을 읽는다.
# 입력 in 은 원문 상호다. 두 구현 모두 정규화기(T1)를 먼저 돌리고 그 결과로 판정한다(B3b 호출 순서와 같다).
# 상호는 합성 이름이다. PG 이름만 실제 패턴에 걸리는 것을 쓴다.
#
# 기대값
#   blocked    차단 여부
#   pg_tokens  PG 로 판정된 토큰. 토큰에서 못 찾고 원문에서 찾으면 원문 하나
#   hint       PG 가 아닌 토큰(되묻기 힌트) = matched_suffix
#   dropped    hint_ignore 에 걸린 구조 토큰
cases:
  # ── 토큰 하나만 PG ─────────────────────────────────────────
  - { in: "토스페이_가나다샵", blocked: true, pg_tokens: ["토스페이"], hint: ["가나다샵"], dropped: [] }
  # '-' 는 토큰이 3개 이상이거나 PG 가 보일 때만 자른다
  - { in: "가나다샵-라마바-토스페이먼츠", blocked: true, pg_tokens: ["토스페이먼츠"], hint: ["가나다샵", "라마바"], dropped: [] }

  # ── 전부 PG ────────────────────────────────────────────────
  - { in: "토스페이_비바리퍼블리카", blocked: true, pg_tokens: ["토스페이", "비바리퍼블리카"], hint: [], dropped: [] }

  # ── 분해 안 된 문자열 속 PG ────────────────────────────────
  # 구분자가 없으면 정규화 결과 한 덩어리가 토큰이다
  - { in: "가나다샵토스페이", blocked: true, pg_tokens: ["가나다샵토스페이"], hint: [], dropped: [] }
  # 정규화가 '토스페이점' 을 지점명으로 지운다. 토큰엔 PG 가 없고 원문에만 있어 원문 전체가 PG 다
  - { in: "가나다샵 토스페이점", blocked: true, pg_tokens: ["가나다샵 토스페이점"], hint: [], dropped: [] }

  # ── 구조 토큰만 남음 ───────────────────────────────────────
  - { in: "토스페이_대표", blocked: true, pg_tokens: ["토스페이"], hint: [], dropped: ["대표"] }
  - { in: "다날_3건", blocked: true, pg_tokens: ["다날"], hint: [], dropped: ["3건"] }
  # 힌트와 구조 토큰이 섞인 경우
  - { in: "다날_가나다샵_대표", blocked: true, pg_tokens: ["다날"], hint: ["가나다샵"], dropped: ["대표"] }

  # ── 대소문자 혼합 ──────────────────────────────────────────
  # 토큰은 대문자화 전에 잘리므로 원래 대소문자 그대로 남는다
  - { in: "PayPal *가나다샵", blocked: true, pg_tokens: ["PayPal"], hint: ["가나다샵"], dropped: [] }
  - { in: "paypal*가나다샵", blocked: true, pg_tokens: ["paypal"], hint: ["가나다샵"], dropped: [] }

  # ── PG 아님 ────────────────────────────────────────────────
  - { in: "가나다커피_해운대", blocked: false, pg_tokens: [], hint: [], dropped: [] }
  - { in: "가나다샵", blocked: false, pg_tokens: [], hint: [], dropped: [] }

  # ── 짧은 패턴('다날') 오탐 경계 ────────────────────────────
  # 현재 동작을 고정한다. '다날' 이 다른 글자 사이에 있어도 걸린다(오탐).
  # pg_blocklist.yaml open_questions.danal_generic 의 '그대로 둔다' 결정을 따른다. 바꾸면 이 줄도 바꾼다.
  - { in: "가나다날식당", blocked: true, pg_tokens: ["가나다날식당"], hint: [], dropped: [] }
  - { in: "다나루식당", blocked: false, pg_tokens: [], hint: [], dropped: [] }

  # ── 알려진 한계 ────────────────────────────────────────────
  # 패턴이 구분자를 사이에 두고 갈리면 토큰에도 원문에도 걸리지 않는다('NHN\s*KCP' 는 '-' 를 못 넘는다).
  - { in: "NHN-KCP_가나다샵", blocked: false, pg_tokens: [], hint: [], dropped: [] }
